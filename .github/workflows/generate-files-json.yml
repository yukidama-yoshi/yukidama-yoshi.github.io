name: Generate files.json

permissions:
  contents: write   # ← これが無いと push が必ず失敗する

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate files.json
        run: |
          node << 'EOF'
          const fs = require('fs');
          const path = require('path');

          const ROOT = "files";   // ← フォルダ名。必要なら変更。

          function walk(dir) {
            let results = [];
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat.isDirectory()) {
                results = results.concat(walk(fullPath));
              } else {
                results.push({
                  name: file,
                  path: fullPath.replace(/\\/g, "/"),
                  size: stat.size
                });
              }
            });
            return results;
          }

          let output = [];
          if (fs.existsSync(ROOT)) {
            output = walk(ROOT);
          }

          fs.writeFileSync("files.json", JSON.stringify(output, null, 2));
          EOF

      - name: Commit files.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add files.json
          git commit -m "Update files.json" || echo "No changes"
          git push
