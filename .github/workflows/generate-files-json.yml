name: Generate files.json

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate files.json
        shell: bash
        run: |
          mkdir -p files

          echo "[" > files.json

          find files -type f | while read -r FILE; do
            # GNU stat or BSD stat のどちらでも動く
            if stat --version >/dev/null 2>&1; then
              SIZE=$(stat --format=%s "$FILE")
            else
              SIZE=$(stat -f%z "$FILE")
            fi

            NAME=$(basename "$FILE")
            PATH="$FILE"

            echo "  {\"name\": \"${NAME}\", \"path\": \"${PATH}\", \"size\": ${SIZE}}," >> files.json
          done

          sed -i '$ s/,$//' files.json || true

          echo "]" >> files.json

      - name: Commit files.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add files.json
          git commit -m "Update files.json" || echo "No changes"
          git push
