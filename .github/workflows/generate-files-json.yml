name: Generate files.json

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Generate files.json
        run: |
          # files フォルダが無ければ作る（エラー防止）
          mkdir -p files

          echo "[" > files.json

          # files 内のファイルを列挙
          find files -type f | while read -r FILE; do
            # stat の互換処理（GNU / busybox どちらでも動く）
            SIZE=$(stat -c%s "$FILE" 2>/dev/null || stat -f%z "$FILE")

            NAME=$(basename "$FILE")
            PATH="$FILE"

            echo "  {\"name\": \"${NAME}\", \"path\": \"${PATH}\", \"size\": ${SIZE}}," >> files.json
          done

          # 最後のカンマを削除（空ファイルでも安全）
          sed -i '$ s/,$//' files.json || true

          echo "]" >> files.json

      - name: Commit files.json
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add files.json
          git commit -m "Update files.json" || echo "No changes"
          git push
