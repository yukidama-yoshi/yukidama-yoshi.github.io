<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>掲示板 - ゆきだまのホームページ</title>

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/bbs.css">
</head>

<body>

  <div class="version-tag">Ver 1.6</div>

  <nav class="sidebar" id="sidebar"></nav>

  <div class="resizer" id="resizer"></div>

  <div class="main">

    <h1>掲示板</h1>

    <p>
      ゆきだまのホームページ掲示板です。<br>
      ご自由に投稿してください。
    </p>
<div id="reply-box" style="display:none; margin-bottom:15px; padding:10px; border:1px solid #999; background:#ffffe0;">
  <strong>返信先：</strong>
  <span id="reply-target-text"></span>

  <button id="cancel-reply" style="margin-left:15px;">
    返信をやめる
  </button>
</div>

    <div class="bbs-form">

      <h2>投稿</h2>

      <label>
        名前：
        <input type="text" id="name">
      </label>

      <br><br>

      <label>
        本文：
        <br>
        <textarea id="message"></textarea>
      </label>

      <br>

      <button id="post-button">
        投稿する
      </button>

    </div>


    <hr>


    <h2>投稿一覧</h2>

    <div id="posts">
      読み込み中...
    </div>


    <footer>
      <p>© 2026 ゆきだま. All rights reserved.</p>
    </footer>

  </div>


<script src="js/load-sidebar.js"></script>

<script src="js/bbs.js"></script>


<script>
/* サイドバーリサイズ機能 */

const resizer = document.getElementById('resizer');
const sidebarEl = document.getElementById('sidebar');

let isResizing = false;

resizer.addEventListener('mousedown', () => {
  isResizing = true;
  document.body.style.cursor = 'ew-resize';
});


document.addEventListener('mousemove', (e) => {

  if (!isResizing) return;

  if (e.clientX > 100 && e.clientX < 600) {
    sidebarEl.style.width = e.clientX + 'px';
  }

});


document.addEventListener('mouseup', () => {

  isResizing = false;
  document.body.style.cursor = 'default';

});


/* 管理者モード */

const urlParams = new URLSearchParams(window.location.search);

if (urlParams.get('admin') === '1') {

  localStorage.setItem(
    'is_admin_yukidama',
    'true'
  );

  alert("管理者モードを有効にしました。");

}

</script>

</body>
</html>
