<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>掲示板 - ゆきだまのホームページ</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/bbs.css">
  <style>
    /* 文字数カウンター */
    .char-count {
      font-size: 12px;
      color: #666;
      margin-top: 4px;
      text-align: right;
    }
    .char-count.over {
      color: #c00;
      font-weight: bold;
    }

    /* 超過時の入力欄強調 */
    .form-item input.over,
    .form-item textarea.over {
      border-color: #c00;
      background-color: #fff5f5;
    }

    .form-item {
      margin-bottom: 14px;
    }
    .form-item label {
      display: block;
      margin-bottom: 4px;
    }
    .form-item input[type="text"],
    .form-item textarea {
      width: 100%;
      max-width: 500px;
      box-sizing: border-box;
      padding: 6px;
      font-family: "MS Gothic", "Osaka", sans-serif;
      border: 1px solid #aaa;
    }
    .form-item textarea {
      height: 120px;
      resize: vertical;
    }

    /* 投稿ボタン無効時 */
    #post-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="version-tag">Ver 1.8</div>
  <nav class="sidebar" id="sidebar"></nav>
  <div class="resizer" id="resizer"></div>
  <div class="main">
    <h1>掲示板</h1>
    <p>
      ゆきだまのホームページ 掲示板です。<br>
      ご自由に投稿してください。キリ番報告等もこちらで。<br>
      ※誰かを傷つける投稿や法令に違反するような投稿は絶対に行わないでください。
    </p>

    <!-- 返信先表示 -->
    <div id="reply-box" style="display:none;">
      <strong>返信先：</strong>
      <span id="reply-target-text"></span>
      <button id="cancel-reply" type="button">
        返信をやめる
      </button>
    </div>

    <!-- 投稿フォーム -->
    <div class="bbs-form">
      <h2>投稿</h2>

      <div class="form-item">
        <label for="name">名前：</label>
        <input
          type="text"
          id="name"
          autocomplete="nickname"
        >
        <div class="char-count" id="name-count">0 / 30</div>
      </div>

      <div class="form-item">
        <label for="message">本文：</label>
        <textarea id="message"></textarea>
        <div class="char-count" id="message-count">0 / 500</div>
      </div>

      <button id="post-button" type="button">
        投稿する
      </button>
    </div>

    <hr>

    <h2>投稿一覧</h2>
    <div id="posts">
      読み込み中...
    </div>

    <footer>
      <p>© 2026 ゆきだま. All rights reserved.</p>
    </footer>
  </div>

  <script src="js/load-sidebar.js"></script>
  <script src="js/bbs.js"></script>

  <script>
    /* =====================================================
       リアルタイム文字数チェック（強制カットなし）
       ===================================================== */

    const nameInput     = document.getElementById("name");
    const messageInput  = document.getElementById("message");
    const nameCount     = document.getElementById("name-count");
    const messageCount  = document.getElementById("message-count");
    const postButton    = document.getElementById("post-button");

    const NAME_MAX    = 30;
    const MESSAGE_MAX = 500;

    function updateCount(input, counter, max) {
      const length = input.value.length;
      counter.textContent = length + " / " + max;

      if (length > max) {
        counter.classList.add("over");
        input.classList.add("over");
        counter.textContent = length + " / " + max + "（文字数超過）";
      } else {
        counter.classList.remove("over");
        input.classList.remove("over");
      }

      // どちらかが超過していたら投稿ボタンを無効化
      updatePostButtonState();
    }

    function updatePostButtonState() {
      const nameOver    = nameInput.value.length > NAME_MAX;
      const messageOver = messageInput.value.length > MESSAGE_MAX;

      postButton.disabled = nameOver || messageOver;
    }

    nameInput.addEventListener("input", () => {
      updateCount(nameInput, nameCount, NAME_MAX);
    });

    messageInput.addEventListener("input", () => {
      updateCount(messageInput, messageCount, MESSAGE_MAX);
    });

    // 初期表示
    updateCount(nameInput, nameCount, NAME_MAX);
    updateCount(messageInput, messageCount, MESSAGE_MAX);


    /* =====================================================
       サイドバーリサイズ機能
       ===================================================== */
    const resizer = document.getElementById('resizer');
    const sidebarEl = document.getElementById('sidebar');
    let isResizing = false;

    resizer.addEventListener('mousedown', () => {
      isResizing = true;
      document.body.style.cursor = 'ew-resize';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      if (e.clientX > 100 && e.clientX < 600) {
        sidebarEl.style.width = e.clientX + 'px';
      }
    });

    document.addEventListener('mouseup', () => {
      isResizing = false;
      document.body.style.cursor = 'default';
    });


    /* =====================================================
       管理者モード
       ===================================================== */
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === '1') {
      localStorage.setItem(
        'is_admin_yukidama',
        'true'
      );
      alert("管理者モードを有効にしました。\n 注：実際に管理者向けの機能を使うには、管理者パスワードでのログインが必要です。");
    }
  </script>
</body>
</html>
