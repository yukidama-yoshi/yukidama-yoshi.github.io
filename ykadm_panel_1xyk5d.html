<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <title>管理者パネル - ゆきだまのホームページ</title>

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/bbs.css">
</head>

<body>

  <div class="version-tag">Ver 1.6</div>

  <nav class="sidebar" id="sidebar"></nav>

  <div class="resizer" id="resizer"></div>

  <div class="main">

    <h1>管理者パネル</h1>


    <!-- =========================================
         ログイン画面
         ========================================= -->

    <div id="login-area">

      <p>
        掲示板の管理者用ページです。
      </p>


      <div class="bbs-form">

        <h2>管理者ログイン</h2>


        <div class="admin-login-field">

          <label for="username">
            ユーザー名：
          </label>

          <input
            type="text"
            id="username"
            autocomplete="username"
          >

        </div>


        <br>


        <div class="admin-login-field">

          <label for="password">
            パスワード：
          </label>

          <input
            type="password"
            id="password"
            autocomplete="current-password"
          >

        </div>


        <br>


        <button id="login-button">
          ログイン
        </button>


        <p
          id="login-message"
          style="display:none;"
        ></p>

      </div>

    </div>



    <!-- =========================================
         管理画面
         ========================================= -->

    <div
      id="admin-area"
      style="display:none;"
    >

      <p>
        管理者としてログインしています。
      </p>


      <div class="bbs-form">

        <h2>管理者メニュー</h2>


        <p>
          現在は認証機能のみ実装されています。
        </p>


        <button id="logout-button">
          ログアウト
        </button>

      </div>

    </div>



    <hr>


    <p>
      <a href="bbs.html">
        掲示板へ戻る
      </a>
    </p>


    <footer>

      <p>
        © 2026 ゆきだま. All rights reserved.
      </p>

    </footer>

  </div>



  <script src="js/load-sidebar.js"></script>


  <script>
    /* =====================================================
       設定
       ===================================================== */

    const API_URL =
      "https://kziban-api.y-bb0.workers.dev";


    const SESSION_KEY =
      "kziban_admin_session";



    /* =====================================================
       要素取得
       ===================================================== */

    const loginArea =
      document.getElementById("login-area");

    const adminArea =
      document.getElementById("admin-area");


    const usernameInput =
      document.getElementById("username");

    const passwordInput =
      document.getElementById("password");


    const loginButton =
      document.getElementById("login-button");

    const logoutButton =
      document.getElementById("logout-button");


    const loginMessage =
      document.getElementById("login-message");



    /* =====================================================
       セッション取得
       ===================================================== */

    function getSession() {

      return sessionStorage.getItem(
        SESSION_KEY
      );

    }



    /* =====================================================
       ログイン画面表示
       ===================================================== */

    function showLogin() {

      loginArea.style.display =
        "block";

      adminArea.style.display =
        "none";

    }



    /* =====================================================
       管理画面表示
       ===================================================== */

    function showAdmin() {

      loginArea.style.display =
        "none";

      adminArea.style.display =
        "block";

    }



    /* =====================================================
       セッション確認
       ===================================================== */

    async function checkSession() {

      const session =
        getSession();


      if (!session) {

        showLogin();

        return;

      }


      try {

        const response =
          await fetch(
            API_URL +
            "/api/admin/check",
            {
              method: "GET",

              headers: {
                "Authorization":
                  "Bearer " + session
              }
            }
          );


        if (!response.ok) {

          sessionStorage.removeItem(
            SESSION_KEY
          );

          showLogin();

          return;

        }


        const result =
          await response.json();


        if (
          result.authenticated === true
        ) {

          showAdmin();

        } else {

          sessionStorage.removeItem(
            SESSION_KEY
          );

          showLogin();

        }


      } catch (error) {

        console.error(error);

        showLogin();

      }

    }



    /* =====================================================
       ログイン
       ===================================================== */

    loginButton.addEventListener(
      "click",
      async () => {

        const username =
          usernameInput.value.trim();

        const password =
          passwordInput.value;


        loginMessage.style.display =
          "none";


        if (
          !username ||
          !password
        ) {

          loginMessage.textContent =
            "ユーザー名とパスワードを入力してください。";

          loginMessage.style.display =
            "block";

          return;

        }


        loginButton.disabled =
          true;

        loginButton.textContent =
          "ログイン中...";


        try {

          const response =
            await fetch(
              API_URL +
              "/api/admin/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    username:
                      username,

                    password:
                      password
                  })
              }
            );


          const result =
            await response.json();


          if (
            response.ok &&
            result.success === true &&
            result.session
          ) {

            /*
             * セッションIDを保存
             */

            sessionStorage.setItem(
              SESSION_KEY,
              result.session
            );


            /*
             * 入力欄をクリア
             */

            passwordInput.value =
              "";


            /*
             * 管理画面へ
             */

            showAdmin();


            return;

          }


          loginMessage.textContent =
            "ユーザー名またはパスワードが違います。";

          loginMessage.style.display =
            "block";


        } catch (error) {

          console.error(error);

          loginMessage.textContent =
            "通信エラーが発生しました。";

          loginMessage.style.display =
            "block";

        }


        loginButton.disabled =
          false;

        loginButton.textContent =
          "ログイン";

      }
    );



    /* =====================================================
       Enterキー
       ===================================================== */

    passwordInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          loginButton.click();

        }

      }
    );



    /* =====================================================
       ログアウト
       ===================================================== */

    logoutButton.addEventListener(
      "click",
      async () => {

        const session =
          getSession();


        if (session) {

          try {

            await fetch(
              API_URL +
              "/api/admin/logout",
              {
                method: "POST",

                headers: {
                  "Authorization":
                    "Bearer " + session
                }
              }
            );

          } catch (error) {

            console.error(error);

          }

        }


        /*
         * ブラウザからセッションを削除
         */

        sessionStorage.removeItem(
          SESSION_KEY
        );


        showLogin();

      }
    );



    /* =====================================================
       サイドバーリサイズ
       ===================================================== */

    const resizer =
      document.getElementById(
        "resizer"
      );

    const sidebarEl =
      document.getElementById(
        "sidebar"
      );


    let isResizing =
      false;


    resizer.addEventListener(
      "mousedown",
      () => {

        isResizing =
          true;

        document.body.style.cursor =
          "ew-resize";

      }
    );


    document.addEventListener(
      "mousemove",
      (e) => {

        if (!isResizing) {

          return;

        }


        if (
          e.clientX > 100 &&
          e.clientX < 600
        ) {

          sidebarEl.style.width =
            e.clientX + "px";

        }

      }
    );


    document.addEventListener(
      "mouseup",
      () => {

        isResizing =
          false;

        document.body.style.cursor =
          "default";

      }
    );



    /* =====================================================
       初期処理
       ===================================================== */

    checkSession();

  </script>

</body>
</html>
