<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <title>管理者パネル - ゆきだまのホームページ</title>

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/bbs.css">


  <style>

    /* =====================================================
       初期状態
       ===================================================== */

    #loading {
      padding: 40px;
    }


    #login-screen,
    #admin-screen {
      display: none;
    }



    /* =====================================================
       ログイン画面
       ===================================================== */

    .login-box {

      max-width: 400px;

      border: 1px solid #ccc;

      background: rgba(255,255,255,0.8);

      padding: 20px;

      margin-top: 20px;

    }


    .login-box h2 {

      font-size: 18px;

      margin-top: 0;

      border-bottom: 1px solid #ccc;

      padding-bottom: 5px;

    }


    .login-row {

      margin-bottom: 15px;

    }


    .login-row label {

      display: block;

      margin-bottom: 5px;

    }


    .login-row input {

      box-sizing: border-box;

      width: 100%;

      max-width: 350px;

      padding: 6px;

      font-family:
        "MS Gothic",
        "Osaka",
        sans-serif;

    }


    .login-button {

      cursor: pointer;

      padding: 6px 15px;

      font-family:
        "MS Gothic",
        "Osaka",
        sans-serif;

    }


    .login-button:disabled {

      cursor: default;

    }


    #login-error {

      display: none;

      margin-top: 15px;

      padding: 8px;

      border: 1px solid #cc9999;

      background: #fff0f0;

      color: #900;

    }



    /* =====================================================
       管理画面
       ===================================================== */

    .admin-panel {

      max-width: 900px;

    }


    .admin-box {

      border: 1px solid #ccc;

      background: rgba(255,255,255,0.8);

      padding: 15px;

      margin-bottom: 20px;

    }


    .admin-box h2 {

      font-size: 18px;

      margin-top: 0;

      border-bottom: 1px solid #ccc;

      padding-bottom: 5px;

    }



    /* =====================================================
       統計情報
       ===================================================== */

    .stats-grid {

      display: grid;

      grid-template-columns:
        repeat(2, minmax(200px, 1fr));

      gap: 10px;

    }


    .stat-item {

      border: 1px solid #ccc;

      background: #fff;

      padding: 10px;

    }


    .stat-label {

      font-size: 13px;

      color: #555;

    }


    .stat-value {

      font-size: 22px;

      font-weight: bold;

      margin-top: 3px;

    }



    /* =====================================================
       ボタン
       ===================================================== */

    .admin-button {

      cursor: pointer;

      padding: 5px 12px;

      font-family:
        "MS Gothic",
        "Osaka",
        sans-serif;

    }


    .admin-button:disabled {

      cursor: default;

    }



    /* =====================================================
       投稿フィルター
       ===================================================== */

    .post-filter {

      display: flex;

      flex-wrap: wrap;

      gap: 6px;

      margin-bottom: 15px;

    }


    .filter-button {

      cursor: pointer;

      padding: 6px 14px;

      border: 1px solid #aaa;

      background: #eee;

      font-family:
        "MS Gothic",
        "Osaka",
        sans-serif;

    }


    .filter-button:hover {

      background: #ddd;

    }


    /*
     * 現在選択中のフィルター
     */

    .filter-button.active {

      background: #555;

      color: #fff;

      border-color: #333;

      font-weight: bold;

    }



    /* =====================================================
       管理用投稿
       ===================================================== */

    .admin-post {

      border-bottom: 1px dotted #999;

      padding: 15px 0;

    }


    .admin-post:last-child {

      border-bottom: none;

    }


    .admin-post-header {

      font-size: 14px;

      color: #555;

      margin-bottom: 8px;

    }


    .admin-post-message {

      white-space: pre-wrap;

      overflow-wrap: anywhere;

      margin-bottom: 10px;

    }


    .admin-post-info {

      font-size: 12px;

      color: #777;

      margin-bottom: 8px;

    }


    .deleted-post {

      opacity: 0.65;

      background: #f5f5f5;

      padding: 10px;

    }


    .deleted-label {

      color: #a00;

      font-weight: bold;

      margin-top: 8px;

      margin-bottom: 8px;

    }



    /* =====================================================
       管理用メッセージ
       ===================================================== */

    .admin-message {

      margin-top: 10px;

      font-size: 13px;

      color: #555;

    }



    /* =====================================================
       スマートフォン
       ===================================================== */

    @media (max-width: 600px) {

      .stats-grid {

        grid-template-columns: 1fr;

      }

    }

  </style>

</head>



<body>


  <!-- =====================================================
       バージョン
       ===================================================== -->

  <div class="version-tag">
    Ver 1.6
  </div>



  <!-- =====================================================
       サイドバー
       ===================================================== -->

  <nav
    class="sidebar"
    id="sidebar"
  ></nav>


  <div
    class="resizer"
    id="resizer"
  ></div>



  <!-- =====================================================
       認証確認中
       ===================================================== -->

  <div id="loading">

    管理者認証を確認しています...

  </div>



  <!-- =====================================================
       ログイン画面
       ===================================================== -->

  <div
    class="main"
    id="login-screen"
  >

    <h1>
      管理者ログイン
    </h1>


    <p>
      管理者パネルを利用するにはログインしてください。
    </p>


    <div class="login-box">

      <h2>
        ログイン
      </h2>


      <form id="login-form">


        <div class="login-row">

          <label for="login-username">
            ユーザー名
          </label>

          <input
            type="text"
            id="login-username"
            autocomplete="username"
            required
          >

        </div>



        <div class="login-row">

          <label for="login-password">
            パスワード
          </label>

          <input
            type="password"
            id="login-password"
            autocomplete="current-password"
            required
          >

        </div>



        <button
          type="submit"
          class="login-button"
          id="login-button"
        >
          ログイン
        </button>



        <div
          id="login-error"
        >
          ユーザー名またはパスワードが違います。
        </div>


      </form>

    </div>


    <p>

      <a href="bbs.html">
        掲示板へ戻る
      </a>

    </p>


    <footer>

      <p>
        © 2026 ゆきだま.
        All rights reserved.
      </p>

    </footer>

  </div>



  <!-- =====================================================
       管理画面
       ===================================================== -->

  <div
    class="main"
    id="admin-screen"
  >

    <h1>
      管理者パネル
    </h1>


    <p>
      掲示板の管理を行います。
    </p>


    <div class="admin-panel">



      <!-- =================================================
           統計情報
           ================================================= -->

      <div class="admin-box">

        <h2>
          掲示板統計
        </h2>


        <div class="stats-grid">


          <div class="stat-item">

            <div class="stat-label">
              総投稿数
            </div>

            <div
              class="stat-value"
              id="total-posts"
            >
              -
            </div>

          </div>



          <div class="stat-item">

            <div class="stat-label">
              親投稿数
            </div>

            <div
              class="stat-value"
              id="parent-posts"
            >
              -
            </div>

          </div>



          <div class="stat-item">

            <div class="stat-label">
              返信数
            </div>

            <div
              class="stat-value"
              id="replies"
            >
              -
            </div>

          </div>



          <div class="stat-item">

            <div class="stat-label">
              総文字数
            </div>

            <div
              class="stat-value"
              id="total-characters"
            >
              -
            </div>

          </div>



          <div class="stat-item">

            <div class="stat-label">
              平均文字数
            </div>

            <div
              class="stat-value"
              id="average-characters"
            >
              -
            </div>

          </div>



          <div class="stat-item">

            <div class="stat-label">
              今日の投稿数
            </div>

            <div
              class="stat-value"
              id="today-posts"
            >
              -
            </div>

          </div>



          <div class="stat-item">

            <div class="stat-label">
              今月の投稿数
            </div>

            <div
              class="stat-value"
              id="month-posts"
            >
              -
            </div>

          </div>



          <div class="stat-item">

            <div class="stat-label">
              投稿データ容量（概算）
            </div>

            <div
              class="stat-value"
              id="estimated-size"
            >
              -
            </div>

          </div>


        </div>


        <div style="margin-top:15px;">

          <button
            class="admin-button"
            id="reload-stats"
          >
            統計を更新
          </button>

        </div>


        <div
          class="admin-message"
          id="stats-message"
        ></div>

      </div>



      <!-- =================================================
           投稿管理
           ================================================= -->

      <div class="admin-box">

        <h2>
          投稿管理
        </h2>


        <!-- フィルター -->

        <div
          class="post-filter"
          role="group"
          aria-label="投稿フィルター"
        >


          <button
            type="button"
            class="filter-button active"
            data-filter="all"
          >
            すべて
          </button>


          <button
            type="button"
            class="filter-button"
            data-filter="active"
          >
            公開中
          </button>


          <button
            type="button"
            class="filter-button"
            data-filter="deleted"
          >
            削除済み
          </button>


        </div>



        <!-- 投稿一覧 -->

        <div id="admin-posts">

          読み込み中...

        </div>


        <div
          class="admin-message"
          id="posts-message"
        ></div>

      </div>



      <!-- =================================================
           管理者操作
           ================================================= -->

      <div class="admin-box">

        <h2>
          管理者操作
        </h2>


        <button
          class="admin-button"
          id="logout-button"
        >
          ログアウト
        </button>

      </div>


    </div>



    <hr>


    <p>

      <a href="bbs.html">
        掲示板へ戻る
      </a>

    </p>


    <footer>

      <p>
        © 2026 ゆきだま.
        All rights reserved.
      </p>

    </footer>

  </div>



  <!-- =====================================================
       JavaScript
       ===================================================== -->


  <script src="js/load-sidebar.js"></script>


  <script>

    /* =====================================================
       設定
       ===================================================== */

    const API_URL =
      "https://kziban-api.y-bb0.workers.dev";


    const SESSION_KEY =
      "kziban_admin_session";


    let adminPosts = [];


    let currentFilter =
      "all";



    /* =====================================================
       DOM
       ===================================================== */

    const loading =
      document.getElementById(
        "loading"
      );


    const loginScreen =
      document.getElementById(
        "login-screen"
      );


    const adminScreen =
      document.getElementById(
        "admin-screen"
      );



    /* =====================================================
       画面切り替え
       ===================================================== */

    function showLoginScreen() {

      loading.style.display =
        "none";


      adminScreen.style.display =
        "none";


      loginScreen.style.display =
        "block";

    }


    function showAdminScreen() {

      loading.style.display =
        "none";


      loginScreen.style.display =
        "none";


      adminScreen.style.display =
        "block";

    }



    /* =====================================================
       セッション取得
       ===================================================== */

    function getSession() {

      return sessionStorage.getItem(
        SESSION_KEY
      );

    }



    /* =====================================================
       セッション確認
       ===================================================== */

    async function checkSession() {

      const session =
        getSession();


      /*
       * セッションがない場合、
       * リロードせずログイン画面を表示する。
       */

      if (!session) {

        showLoginScreen();

        return false;

      }


      try {

        const response =
          await fetch(
            API_URL +
            "/api/admin/check",
            {
              method: "GET",

              headers: {
                "Authorization":
                  "Bearer " +
                  session
              }
            }
          );


        if (!response.ok) {

          sessionStorage.removeItem(
            SESSION_KEY
          );


          showLoginScreen();


          return false;

        }


        const result =
          await response.json();


        if (
          result.authenticated !== true
        ) {

          sessionStorage.removeItem(
            SESSION_KEY
          );


          showLoginScreen();


          return false;

        }


        /*
         * 認証成功
         */

        showAdminScreen();


        return true;


      } catch (error) {

        console.error(error);


        /*
         * 通信そのものに失敗した場合は
         * ログイン画面へ飛ばさない。
         */

        loading.textContent =
          "管理者認証の確認に失敗しました。";


        return false;

      }

    }



    /* =====================================================
       ログイン
       ===================================================== */

    document
      .getElementById(
        "login-form"
      )
      .addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          const username =
            document
              .getElementById(
                "login-username"
              )
              .value
              .trim();


          const password =
            document
              .getElementById(
                "login-password"
              )
              .value;


          const button =
            document
              .getElementById(
                "login-button"
              );


          const errorBox =
            document
              .getElementById(
                "login-error"
              );


          errorBox.style.display =
            "none";


          if (
            !username ||
            !password
          ) {

            errorBox.textContent =
              "ユーザー名またはパスワードが違います。";


            errorBox.style.display =
              "block";


            return;

          }


          button.disabled =
            true;


          button.textContent =
            "ログイン中...";


          try {

            const response =
              await fetch(
                API_URL +
                "/api/admin/login",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body: JSON.stringify({
                    username:
                      username,

                    password:
                      password
                  })
                }
              );


            const result =
              await response.json();


            if (
              !response.ok ||
              result.success !== true ||
              !result.session
            ) {

              errorBox.textContent =
                "ユーザー名またはパスワードが違います。";


              errorBox.style.display =
                "block";


              return;

            }


            /*
             * セッション保存
             */

            sessionStorage.setItem(
              SESSION_KEY,
              result.session
            );


            /*
             * パスワード欄を空にする
             */

            document
              .getElementById(
                "login-password"
              )
              .value = "";


            /*
             * 管理画面表示
             */

            showAdminScreen();


            /*
             * データ取得
             */

            await Promise.all([
              loadStats(),
              loadAdminPosts()
            ]);


          } catch (error) {

            console.error(error);


            errorBox.textContent =
              "ログイン処理に失敗しました。";


            errorBox.style.display =
              "block";


          } finally {

            button.disabled =
              false;


            button.textContent =
              "ログイン";

          }

        }
      );



    /* =====================================================
       統計情報取得
       ===================================================== */

    async function loadStats() {

      const session =
        getSession();


      if (!session) {

        return;

      }


      const button =
        document.getElementById(
          "reload-stats"
        );


      const message =
        document.getElementById(
          "stats-message"
        );


      button.disabled =
        true;


      button.textContent =
        "読み込み中...";


      message.textContent =
        "";


      try {

        const response =
          await fetch(
            API_URL +
            "/api/admin/stats",
            {
              method: "GET",

              headers: {
                "Authorization":
                  "Bearer " +
                  session
              }
            }
          );


        if (
          response.status === 401
        ) {

          handleUnauthorized();

          return;

        }


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const stats =
          await response.json();


        document.getElementById(
          "total-posts"
        ).textContent =
          Number(
            stats.total_posts
          ).toLocaleString(
            "ja-JP"
          ) +
          " 件";


        document.getElementById(
          "parent-posts"
        ).textContent =
          Number(
            stats.parent_posts
          ).toLocaleString(
            "ja-JP"
          ) +
          " 件";


        document.getElementById(
          "replies"
        ).textContent =
          Number(
            stats.replies
          ).toLocaleString(
            "ja-JP"
          ) +
          " 件";


        document.getElementById(
          "total-characters"
        ).textContent =
          Number(
            stats.total_characters
          ).toLocaleString(
            "ja-JP"
          ) +
          " 文字";


        document.getElementById(
          "average-characters"
        ).textContent =
          Number(
            stats.average_characters
          ).toFixed(1) +
          " 文字";


        document.getElementById(
          "today-posts"
        ).textContent =
          Number(
            stats.today_posts
          ).toLocaleString(
            "ja-JP"
          ) +
          " 件";


        document.getElementById(
          "month-posts"
        ).textContent =
          Number(
            stats.this_month_posts
          ).toLocaleString(
            "ja-JP"
          ) +
          " 件";


        /*
         * 現在は文字数から概算。
         *
         * 日本語などを含むUTF-8データを
         * 厳密に測定した値ではない。
         */

        const estimatedBytes =
          Number(
            stats.total_characters
          ) * 3;


        document.getElementById(
          "estimated-size"
        ).textContent =
          formatBytes(
            estimatedBytes
          );


        message.textContent =
          "更新しました。";


      } catch (error) {

        console.error(error);


        message.textContent =
          "統計情報の取得に失敗しました。";


      } finally {

        button.disabled =
          false;


        button.textContent =
          "統計を更新";

      }

    }



    /* =====================================================
       バイト数表示
       ===================================================== */

    function formatBytes(bytes) {

      if (
        !Number.isFinite(bytes) ||
        bytes < 0
      ) {

        return "-";

      }


      if (bytes < 1024) {

        return (
          bytes.toLocaleString(
            "ja-JP"
          ) +
          " B"
        );

      }


      if (
        bytes <
        1024 * 1024
      ) {

        return (
          (bytes / 1024)
            .toFixed(2) +
          " KB"
        );

      }


      if (
        bytes <
        1024 *
        1024 *
        1024
      ) {

        return (
          (bytes /
            1024 /
            1024)
            .toFixed(2) +
          " MB"
        );

      }


      return (
        (bytes /
          1024 /
          1024 /
          1024)
          .toFixed(2) +
        " GB"
      );

    }



    /* =====================================================
       管理者用投稿一覧取得
       ===================================================== */

    async function loadAdminPosts() {

      const session =
        getSession();


      if (!session) {

        return;

      }


      const postsArea =
        document.getElementById(
          "admin-posts"
        );


      const message =
        document.getElementById(
          "posts-message"
        );


      postsArea.textContent =
        "読み込み中...";


      message.textContent =
        "";


      try {

        const response =
          await fetch(
            API_URL +
            "/api/admin/posts",
            {
              method: "GET",

              headers: {
                "Authorization":
                  "Bearer " +
                  session
              }
            }
          );


        if (
          response.status === 401
        ) {

          handleUnauthorized();

          return;

        }


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        adminPosts =
          await response.json();


        renderAdminPosts();


      } catch (error) {

        console.error(error);


        postsArea.textContent =
          "投稿一覧の取得に失敗しました。";

      }

    }



    /* =====================================================
       投稿一覧表示
       ===================================================== */

    function renderAdminPosts() {

      const postsArea =
        document.getElementById(
          "admin-posts"
        );


      postsArea.innerHTML =
        "";


      let filteredPosts;


      if (
        currentFilter === "active"
      ) {

        filteredPosts =
          adminPosts.filter(
            post =>
              Number(
                post.deleted
              ) === 0
          );

      } else if (
        currentFilter === "deleted"
      ) {

        filteredPosts =
          adminPosts.filter(
            post =>
              Number(
                post.deleted
              ) === 1
          );

      } else {

        filteredPosts =
          adminPosts;

      }


      if (
        filteredPosts.length === 0
      ) {

        postsArea.textContent =
          "該当する投稿はありません。";


        return;

      }


      filteredPosts.forEach(
        post => {

          postsArea.appendChild(
            createAdminPostElement(
              post
            )
          );

        }
      );

    }



    /* =====================================================
       管理用投稿要素
       ===================================================== */

    function createAdminPostElement(
      post
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "admin-post";


      const deleted =
        Number(
          post.deleted
        ) === 1;


      if (deleted) {

        div.classList.add(
          "deleted-post"
        );

      }



      /* -----------------------------------------------------
         ヘッダー
         ----------------------------------------------------- */

      const header =
        document.createElement(
          "div"
        );


      header.className =
        "admin-post-header";


      const date =
        new Date(
          post.created_at
        ).toLocaleString(
          "ja-JP"
        );


      header.textContent =
        "ID " +
        post.id +
        "　" +
        post.name +
        "　" +
        date;


      div.appendChild(
        header
      );



      /* -----------------------------------------------------
         投稿種別
         ----------------------------------------------------- */

      const info =
        document.createElement(
          "div"
        );


      info.className =
        "admin-post-info";


      if (
        post.parent_id === null
      ) {

        info.textContent =
          "親投稿";

      } else {

        info.textContent =
          "返信（親投稿ID: " +
          post.parent_id +
          "）";

      }


      div.appendChild(
        info
      );



      /* -----------------------------------------------------
         本文
         ----------------------------------------------------- */

      const message =
        document.createElement(
          "div"
        );


      message.className =
        "admin-post-message";


      message.textContent =
        post.message;


      div.appendChild(
        message
      );



      /* -----------------------------------------------------
         削除済み
         ----------------------------------------------------- */

      if (deleted) {

        const label =
          document.createElement(
            "div"
          );


        label.className =
          "deleted-label";


        label.textContent =
          "削除済み";


        div.appendChild(
          label
        );



        /*
         * 復活ボタン
         */

        const restoreButton =
          document.createElement(
            "button"
          );


        restoreButton.type =
          "button";


        restoreButton.className =
          "admin-button";


        restoreButton.textContent =
          "復活";


        restoreButton.addEventListener(
          "click",
          () => {

            restorePost(
              post.id
            );

          }
        );


        div.appendChild(
          restoreButton
        );


        return div;

      }



      /* -----------------------------------------------------
         削除ボタン
         ----------------------------------------------------- */

      const deleteButton =
        document.createElement(
          "button"
        );


      deleteButton.type =
        "button";


      deleteButton.className =
        "admin-button";


      deleteButton.textContent =
        "削除";


      deleteButton.addEventListener(
        "click",
        () => {

          deletePost(
            post.id
          );

        }
      );


      div.appendChild(
        deleteButton
      );


      return div;

    }



    /* =====================================================
       投稿削除
       ===================================================== */

    async function deletePost(
      id
    ) {

      const confirmed =
        window.confirm(
          "投稿ID " +
          id +
          " を削除しますか？\n\n" +
          "削除すると通常の掲示板には表示されなくなります。"
        );


      if (!confirmed) {

        return;

      }


      const session =
        getSession();


      if (!session) {

        showLoginScreen();

        return;

      }


      try {

        const response =
          await fetch(
            API_URL +
            "/api/admin/posts/" +
            encodeURIComponent(
              id
            ),
            {
              method: "DELETE",

              headers: {
                "Authorization":
                  "Bearer " +
                  session
              }
            }
          );


        if (
          response.status === 401
        ) {

          handleUnauthorized();

          return;

        }


        const result =
          await response.json();


        if (
          !response.ok ||
          result.success !== true
        ) {

          alert(
            "投稿の削除に失敗しました。"
          );


          return;

        }


        /*
         * 投稿一覧・統計を更新
         */

        await Promise.all([
          loadAdminPosts(),
          loadStats()
        ]);


      } catch (error) {

        console.error(error);


        alert(
          "通信エラーが発生しました。"
        );

      }

    }



    /* =====================================================
       投稿復活
       ===================================================== */

    async function restorePost(
      id
    ) {

      const confirmed =
        window.confirm(
          "投稿ID " +
          id +
          " を復活させますか？\n\n" +
          "復活すると通常の掲示板に再び表示されます。"
        );


      if (!confirmed) {

        return;

      }


      const session =
        getSession();


      if (!session) {

        showLoginScreen();

        return;

      }


      try {

        const response =
          await fetch(
            API_URL +
            "/api/admin/posts/" +
            encodeURIComponent(
              id
            ) +
            "/restore",
            {
              method: "POST",

              headers: {
                "Authorization":
                  "Bearer " +
                  session
              }
            }
          );


        if (
          response.status === 401
        ) {

          handleUnauthorized();

          return;

        }


        const result =
          await response.json();


        if (
          !response.ok ||
          result.success !== true
        ) {

          alert(
            "投稿の復活に失敗しました。"
          );


          return;

        }


        /*
         * 投稿一覧・統計を更新
         */

        await Promise.all([
          loadAdminPosts(),
          loadStats()
        ]);


      } catch (error) {

        console.error(error);


        alert(
          "通信エラーが発生しました。"
        );

      }

    }



    /* =====================================================
       認証切れ
       ===================================================== */

    function handleUnauthorized() {

      sessionStorage.removeItem(
        SESSION_KEY
      );


      adminPosts = [];


      showLoginScreen();


      document.getElementById(
        "login-error"
      ).style.display =
        "none";


      document.getElementById(
        "login-password"
      ).value = "";

    }



    /* =====================================================
       フィルター
       ===================================================== */

    document
      .querySelectorAll(
        ".filter-button"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {


              /*
               * 現在のフィルター変更
               */

              currentFilter =
                button.dataset.filter;


              /*
               * 全ボタンの選択状態を解除
               */

              document
                .querySelectorAll(
                  ".filter-button"
                )
                .forEach(
                  otherButton => {

                    otherButton.classList.remove(
                      "active"
                    );

                  }
                );


              /*
               * クリックされたボタンだけ
               * 選択状態にする
               */

              button.classList.add(
                "active"
              );


              /*
               * 投稿一覧更新
               */

              renderAdminPosts();

            }
          );

        }
      );



    /* =====================================================
       統計更新
       ===================================================== */

    document
      .getElementById(
        "reload-stats"
      )
      .addEventListener(
        "click",
        loadStats
      );



    /* =====================================================
       ログアウト
       ===================================================== */

    document
      .getElementById(
        "logout-button"
      )
      .addEventListener(
        "click",
        async () => {

          const session =
            getSession();


          /*
           * サーバー側セッション削除
           */

          if (session) {

            try {

              await fetch(
                API_URL +
                "/api/admin/logout",
                {
                  method: "POST",

                  headers: {
                    "Authorization":
                      "Bearer " +
                      session
                  }
                }
              );

            } catch (error) {

              console.error(error);

            }

          }


          /*
           * ブラウザ側セッション削除
           */

          sessionStorage.removeItem(
            SESSION_KEY
          );


          adminPosts = [];


          /*
           * リロードせずログイン画面へ
           */

          showLoginScreen();

        }
      );



    /* =====================================================
       サイドバーリサイズ
       ===================================================== */

    const resizer =
      document.getElementById(
        "resizer"
      );


    const sidebarEl =
      document.getElementById(
        "sidebar"
      );


    let isResizing =
      false;


    resizer.addEventListener(
      "mousedown",
      () => {

        isResizing =
          true;


        document.body.style.cursor =
          "ew-resize";

      }
    );


    document.addEventListener(
      "mousemove",
      (event) => {

        if (!isResizing) {

          return;

        }


        if (
          event.clientX > 100 &&
          event.clientX < 600
        ) {

          sidebarEl.style.width =
            event.clientX + "px";

        }

      }
    );


    document.addEventListener(
      "mouseup",
      () => {

        isResizing =
          false;


        document.body.style.cursor =
          "default";

      }
    );



    /* =====================================================
       初期化
       ===================================================== */

    async function initialize() {

      /*
       * 認証確認が終わるまで
       * ログイン画面・管理画面のどちらも
       * 表示しない。
       */

      const authenticated =
        await checkSession();


      if (!authenticated) {

        return;

      }


      /*
       * 認証成功後にデータ取得
       */

      await Promise.all([
        loadStats(),
        loadAdminPosts()
      ]);

    }


    initialize();

  </script>


</body>
