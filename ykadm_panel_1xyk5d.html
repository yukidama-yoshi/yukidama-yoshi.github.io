<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KZIBAN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #222;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        Meiryo,
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(1100px, calc(100% - 30px));
      margin: 0 auto;
    }

    /* =========================
       ヘッダー
    ========================= */

    header {
      background: #222;
      color: white;
      border-bottom: 4px solid #111;
    }

    .header-inner {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      margin: 0;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .header-button {
      border: 1px solid #666;
      background: #333;
      color: white;
      padding: 8px 14px;
      border-radius: 6px;
    }

    .header-button:hover {
      background: #444;
    }

    /* =========================
       メイン
    ========================= */

    main {
      padding: 30px 0 60px;
    }

    .section {
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .card-header {
      padding: 18px 20px;
      border-bottom: 1px solid #ddd;
    }

    .card-header h2,
    .card-header h3 {
      margin: 0;
    }

    .card-body {
      padding: 20px;
    }

    /* =========================
       投稿フォーム
    ========================= */

    .reply-notice {
      display: none;
      background: #eef5ff;
      border: 1px solid #b9d4ff;
      padding: 12px 14px;
      border-radius: 6px;
      margin-bottom: 15px;
    }

    .reply-notice strong {
      color: #1769aa;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      border: 1px solid #bbb;
      border-radius: 6px;
      padding: 10px 12px;
      background: white;
      color: #222;
      outline: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    textarea:focus {
      border-color: #555;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .char-count {
      color: #777;
      font-size: 13px;
    }

    .primary-button {
      border: 0;
      border-radius: 6px;
      background: #222;
      color: white;
      padding: 10px 20px;
      font-weight: bold;
    }

    .primary-button:hover {
      background: #444;
    }

    .secondary-button {
      border: 1px solid #bbb;
      border-radius: 6px;
      background: white;
      color: #333;
      padding: 9px 16px;
    }

    .secondary-button:hover {
      background: #f2f2f2;
    }

    .danger-button {
      border: 0;
      border-radius: 6px;
      background: #c62828;
      color: white;
      padding: 9px 15px;
    }

    .danger-button:hover {
      background: #a51e1e;
    }

    .success-button {
      border: 0;
      border-radius: 6px;
      background: #2e7d32;
      color: white;
      padding: 9px 15px;
    }

    .success-button:hover {
      background: #256728;
    }

    /* =========================
       投稿一覧
    ========================= */

    .posts-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .posts-header h2 {
      margin: 0;
    }

    .refresh-button {
      border: 1px solid #bbb;
      background: white;
      padding: 7px 12px;
      border-radius: 6px;
    }

    .post {
      padding: 18px 20px;
      border-bottom: 1px solid #ddd;
    }

    .post:last-child {
      border-bottom: 0;
    }

    .post.reply {
      margin-left: 35px;
      background: #fafafa;
      border-left: 4px solid #ddd;
    }

    .post.deleted {
      opacity: 0.7;
    }

    .post-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 9px;
    }

    .post-id {
      font-size: 12px;
      color: #777;
    }

    .post-name {
      font-weight: bold;
    }

    .post-date {
      font-size: 12px;
      color: #888;
    }

    .post-message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
      margin-bottom: 12px;
    }

    .reply-button {
      border: 1px solid #bbb;
      background: white;
      color: #333;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 13px;
    }

    .reply-button:hover {
      background: #eee;
    }

    .empty {
      padding: 50px 20px;
      text-align: center;
      color: #777;
    }

    /* =========================
       管理画面
    ========================= */

    #adminPanel {
      display: none;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .stat {
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }

    .stat-label {
      font-size: 13px;
      color: #777;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 25px;
      font-weight: bold;
    }

    .admin-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 15px;
    }

    .admin-post {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 10px;
      background: white;
    }

    .admin-post.deleted {
      background: #fff5f5;
    }

    .admin-post-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .admin-post-info {
      font-size: 13px;
      color: #666;
    }

    .admin-post-message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .admin-post-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .admin-small-button {
      border: 1px solid #bbb;
      border-radius: 5px;
      background: white;
      padding: 6px 10px;
      font-size: 13px;
    }

    /* =========================
       モーダル
    ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal {
      width: min(500px, 100%);
      background: white;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .modal-header {
      padding: 18px 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .modal-close {
      border: 0;
      background: transparent;
      font-size: 25px;
      color: #666;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 15px 20px;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    /* =========================
       通知
    ========================= */

    #notification {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 2000;
      display: none;
      max-width: min(400px, calc(100% - 40px));
      padding: 12px 16px;
      background: #222;
      color: white;
      border-radius: 7px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }

    #notification.show {
      display: block;
    }

    /* =========================
       ローディング
    ========================= */

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    /* =========================
       フッター
    ========================= */

    footer {
      text-align: center;
      color: #777;
      font-size: 13px;
      padding: 25px 0;
    }

    /* =========================
       スマホ
    ========================= */

    @media (max-width: 800px) {
      .admin-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .header-inner {
        min-height: 60px;
      }

      .logo {
        font-size: 23px;
      }

      .container {
        width: min(100% - 20px, 1100px);
      }

      main {
        padding-top: 20px;
      }

      .card-body,
      .card-header,
      .post {
        padding: 15px;
      }

      .post.reply {
        margin-left: 15px;
      }

      .admin-grid {
        grid-template-columns: 1fr 1fr;
      }

      .form-footer {
        align-items: stretch;
        flex-direction: column;
      }

      .primary-button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container header-inner">

    <h1 class="logo">KZIBAN</h1>

    <div class="header-actions">
      <button
        id="adminButton"
        class="header-button"
        onclick="openAdminLogin()"
      >
        管理者
      </button>

      <button
        id="logoutButton"
        class="header-button"
        style="display:none"
        onclick="adminLogout()"
      >
        ログアウト
      </button>
    </div>

  </div>
</header>


<main>
  <div class="container">

    <!-- =========================
         一般投稿フォーム
    ========================== -->

    <section class="section card">

      <div class="card-header">
        <h2>投稿する</h2>
      </div>

      <div class="card-body">

        <div
          id="replyNotice"
          class="reply-notice"
        >
          <strong id="replyText"></strong>
          <button
            class="secondary-button"
            style="float:right;padding:4px 9px"
            onclick="cancelReply()"
          >
            返信をやめる
          </button>
          <div style="clear:both"></div>
        </div>

        <div class="form-group">
          <label for="name">名前</label>

          <input
            id="name"
            type="text"
            maxlength="50"
            placeholder="名前"
          >
        </div>

        <div class="form-group">
          <label for="message">本文</label>

          <textarea
            id="message"
            maxlength="10000"
            placeholder="本文を入力してください"
          ></textarea>
        </div>

        <div class="form-footer">

          <span
            id="charCount"
            class="char-count"
          >
            0 / 10000文字
          </span>

          <button
            id="postButton"
            class="primary-button"
            onclick="createPost()"
          >
            投稿する
          </button>

        </div>

      </div>
    </section>


    <!-- =========================
         投稿一覧
    ========================== -->

    <section class="section card">

      <div class="card-header posts-header">

        <h2>投稿一覧</h2>

        <button
          class="refresh-button"
          onclick="loadPosts()"
        >
          更新
        </button>

      </div>

      <div
        id="posts"
        class="card-body"
        style="padding:0"
      >
        <div class="loading">
          読み込み中...
        </div>
      </div>

    </section>


    <!-- =========================
         管理画面
    ========================== -->

    <section
      id="adminPanel"
      class="section"
    >

      <!-- 統計 -->

      <div class="card" style="margin-bottom:20px">

        <div class="card-header">
          <h2>管理者ダッシュボード</h2>
        </div>

        <div class="card-body">

          <div class="admin-grid">

            <div class="stat">
              <div class="stat-label">
                総投稿数
              </div>
              <div
                id="statTotal"
                class="stat-value"
              >
                -
              </div>
            </div>

            <div class="stat">
              <div class="stat-label">
                通常投稿
              </div>
              <div
                id="statParent"
                class="stat-value"
              >
                -
              </div>
            </div>

            <div class="stat">
              <div class="stat-label">
                返信
              </div>
              <div
                id="statReplies"
                class="stat-value"
              >
                -
              </div>
            </div>

            <div class="stat">
              <div class="stat-label">
                総文字数
              </div>
              <div
                id="statCharacters"
                class="stat-value"
              >
                -
              </div>
            </div>

            <div class="stat">
              <div class="stat-label">
                今日の投稿
              </div>
              <div
                id="statToday"
                class="stat-value"
              >
                -
              </div>
            </div>

            <div class="stat">
              <div class="stat-label">
                今月の投稿
              </div>
              <div
                id="statMonth"
                class="stat-value"
              >
                -
              </div>
            </div>

            <div class="stat">
              <div class="stat-label">
                平均文字数
              </div>
              <div
                id="statAverage"
                class="stat-value"
              >
                -
              </div>
            </div>

          </div>

        </div>

      </div>


      <!-- データ管理 -->

      <div class="card" style="margin-bottom:20px">

        <div class="card-header">
          <h3>データ管理</h3>
        </div>

        <div class="card-body">

          <div class="admin-toolbar">

            <button
              class="secondary-button"
              onclick="exportBackup()"
            >
              JSONバックアップを書き出す
            </button>

            <button
              class="secondary-button"
              onclick="document.getElementById('importFile').click()"
            >
              JSONバックアップを読み込む
            </button>

            <input
              id="importFile"
              type="file"
              accept=".json,application/json"
              style="display:none"
              onchange="importBackup(event)"
            >

            <button
              class="danger-button"
              onclick="wipeDatabase()"
            >
              データベース全消去
            </button>

          </div>

          <div style="font-size:13px;color:#777">
            バックアップはJSON形式で保存されます。
            全消去はD1のpostsテーブルを物理削除します。
          </div>

        </div>

      </div>


      <!-- 管理者投稿一覧 -->

      <div class="card">

        <div class="card-header posts-header">

          <h3>投稿管理</h3>

          <button
            class="refresh-button"
            onclick="loadAdminPosts()"
          >
            更新
          </button>

        </div>

        <div
          id="adminPosts"
          class="card-body"
        >
          <div class="loading">
            読み込み中...
          </div>
        </div>

      </div>

    </section>

  </div>
</main>


<footer>
  KZIBAN
</footer>


<!-- =========================
     管理者ログインモーダル
========================== -->

<div
  id="loginModal"
  class="modal-overlay"
>

  <div class="modal">

    <div class="modal-header">

      <h2>管理者ログイン</h2>

      <button
        class="modal-close"
        onclick="closeAdminLogin()"
      >
        ×
      </button>

    </div>

    <div class="modal-body">

      <div class="form-group">

        <label for="adminUsername">
          ユーザー名
        </label>

        <input
          id="adminUsername"
          type="text"
          autocomplete="username"
        >

      </div>

      <div class="form-group">

        <label for="adminPassword">
          パスワード
        </label>

        <input
          id="adminPassword"
          type="password"
          autocomplete="current-password"
        >

      </div>

    </div>

    <div class="modal-footer">

      <button
        class="secondary-button"
        onclick="closeAdminLogin()"
      >
        キャンセル
      </button>

      <button
        class="primary-button"
        onclick="adminLogin()"
      >
        ログイン
      </button>

    </div>

  </div>

</div>


<!-- =========================
     通知
========================== -->

<div id="notification"></div>


<script>

  /*
   * =========================================================
   * Cloudflare Worker API
   * =========================================================
   */

  const API_BASE =
    "https://kziban-api.y-bb0.workers.dev";


  /*
   * =========================================================
   * 状態
   * =========================================================
   */

  let posts = [];

  let replyParentId = null;

  let adminSession =
    sessionStorage.getItem("kziban_admin_session") || null;


  /*
   * =========================================================
   * API
   * =========================================================
   */

  async function apiFetch(
    path,
    options = {}
  ) {

    const headers = {
      ...(options.headers || {})
    };

    if (
      adminSession &&
      !headers.Authorization
    ) {
      headers.Authorization =
        `Bearer ${adminSession}`;
    }

    const response =
      await fetch(
        API_BASE + path,
        {
          ...options,
          headers
        }
      );

    let data = null;

    try {
      data = await response.json();
    } catch {
      data = null;
    }

    if (!response.ok) {

      const message =
        data?.error ||
        `HTTP ${response.status}`;

      throw new Error(message);
    }

    return data;
  }


  /*
   * =========================================================
   * 通知
   * =========================================================
   */

  let notificationTimer = null;

  function notify(message) {

    const element =
      document.getElementById(
        "notification"
      );

    element.textContent =
      message;

    element.classList.add("show");

    clearTimeout(
      notificationTimer
    );

    notificationTimer =
      setTimeout(() => {

        element.classList.remove(
          "show"
        );

      }, 3000);
  }


  /*
   * =========================================================
   * 日付
   * =========================================================
   */

  function formatDate(value) {

    if (!value) {
      return "";
    }

    const date =
      new Date(value);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return value;
    }

    return date.toLocaleString(
      "ja-JP",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }
    );
  }


  /*
   * =========================================================
   * HTMLエスケープ
   * =========================================================
   *
   * ユーザー投稿をinnerHTMLへ入れるため必須。
   */

  function escapeHTML(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  /*
   * =========================================================
   * 投稿一覧
   * =========================================================
   */

  async function loadPosts() {

    const container =
      document.getElementById(
        "posts"
      );

    container.innerHTML =
      `<div class="loading">
        読み込み中...
      </div>`;

    try {

      posts =
        await apiFetch(
          "/api/posts"
        );

      renderPosts();

    } catch (error) {

      console.error(error);

      container.innerHTML =
        `<div class="empty">
          投稿の読み込みに失敗しました。
          <br>
          ${escapeHTML(error.message)}
        </div>`;
    }
  }


  function renderPosts() {

    const container =
      document.getElementById(
        "posts"
      );

    if (
      !Array.isArray(posts) ||
      posts.length === 0
    ) {

      container.innerHTML =
        `<div class="empty">
          まだ投稿がありません。
        </div>`;

      return;
    }


    /*
     * Worker側で
     *
     * ORDER BY id DESC
     *
     * になっているため、ここでは
     * 取得順を維持します。
     */

    const parentPosts =
      posts.filter(
        post =>
          post.parent_id === null ||
          post.parent_id === undefined
      );

    let html = "";

    for (
      const post of parentPosts
    ) {

      html +=
        renderPublicPost(
          post,
          false
        );

      /*
       * この投稿への返信
       */

      const replies =
        posts.filter(
          reply =>
            Number(reply.parent_id) ===
            Number(post.id)
        );

      for (
        const reply of replies
      ) {

        html +=
          renderPublicPost(
            reply,
            true
          );
      }
    }


    /*
     * 親が存在しない返信があった場合
     * それも表示する。
     */

    const shownIds =
      new Set();

    for (
      const post of parentPosts
    ) {

      shownIds.add(
        Number(post.id)
      );

      const replies =
        posts.filter(
          reply =>
            Number(reply.parent_id) ===
            Number(post.id)
        );

      for (
        const reply of replies
      ) {
        shownIds.add(
          Number(reply.id)
        );
      }
    }

    const orphanReplies =
      posts.filter(
        post =>
          post.parent_id !== null &&
          !shownIds.has(
            Number(post.id)
          )
      );

    for (
      const post of orphanReplies
    ) {

      html +=
        renderPublicPost(
          post,
          true
        );
    }


    container.innerHTML =
      html;
  }


  function renderPublicPost(
    post,
    isReply
  ) {

    return `
      <article
        class="post ${isReply ? "reply" : ""}"
      >

        <div class="post-meta">

          <span class="post-id">
            No.${escapeHTML(post.id)}
          </span>

          <span class="post-name">
            ${escapeHTML(post.name)}
          </span>

          <span class="post-date">
            ${escapeHTML(
              formatDate(
                post.created_at
              )
            )}
          </span>

        </div>

        <div class="post-message">
          ${escapeHTML(post.message)}
        </div>

        <button
          class="reply-button"
          onclick="setReply(${Number(post.id)})"
        >
          No.${Number(post.id)}に返信
        </button>

      </article>
    `;
  }


  /*
   * =========================================================
   * 投稿
   * =========================================================
   */

  async function createPost() {

    const name =
      document
        .getElementById("name")
        .value
        .trim();

    const message =
      document
        .getElementById("message")
        .value
        .trim();

    if (!name) {

      notify(
        "名前を入力してください"
      );

      return;
    }

    if (!message) {

      notify(
        "本文を入力してください"
      );

      return;
    }


    const button =
      document.getElementById(
        "postButton"
      );

    button.disabled = true;

    try {

      await apiFetch(
        "/api/posts",
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              name,
              message,
              parent_id:
                replyParentId
            })
        }
      );

      document
        .getElementById("message")
        .value = "";

      updateCharCount();

      cancelReply();

      notify(
        "投稿しました"
      );

      await loadPosts();

      if (adminSession) {
        await loadStats();
        await loadAdminPosts();
      }

    } catch (error) {

      console.error(error);

      notify(
        "投稿に失敗しました: " +
        error.message
      );

    } finally {

      button.disabled = false;
    }
  }


  /*
   * =========================================================
   * 返信
   * =========================================================
   */

  function setReply(id) {

    replyParentId =
      Number(id);

    const notice =
      document.getElementById(
        "replyNotice"
      );

    const text =
      document.getElementById(
        "replyText"
      );

    text.textContent =
      `投稿ID ${id} に返信します`;

    notice.style.display =
      "block";

    document
      .getElementById("message")
      .focus();

    window.scrollTo({
      top:
        document
          .querySelector(
            ".section.card"
          )
          .getBoundingClientRect()
          .top +
        window.scrollY -
        20,
      behavior: "smooth"
    });
  }


  function cancelReply() {

    replyParentId = null;

    document
      .getElementById(
        "replyNotice"
      )
      .style.display = "none";
  }


  /*
   * =========================================================
   * 文字数
   * =========================================================
   */

  function updateCharCount() {

    const message =
      document.getElementById(
        "message"
      ).value;

    document.getElementById(
      "charCount"
    ).textContent =
      `${message.length} / 10000文字`;
  }


  /*
   * =========================================================
   * 管理者ログイン
   * =========================================================
   */

  function openAdminLogin() {

    document
      .getElementById(
        "loginModal"
      )
      .classList.add("show");

    document
      .getElementById(
        "adminUsername"
      )
      .focus();
  }


  function closeAdminLogin() {

    document
      .getElementById(
        "loginModal"
      )
      .classList.remove("show");
  }


  async function adminLogin() {

    const username =
      document
        .getElementById(
          "adminUsername"
        )
        .value;

    const password =
      document
        .getElementById(
          "adminPassword"
        )
        .value;

    if (!username || !password) {

      notify(
        "ユーザー名とパスワードを入力してください"
      );

      return;
    }


    try {

      const result =
        await apiFetch(
          "/api/admin/login",
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body:
              JSON.stringify({
                username,
                password
              })
          }
        );


      if (
        !result.session
      ) {

        throw new Error(
          "セッションIDを取得できませんでした"
        );
      }


      adminSession =
        result.session;

      sessionStorage.setItem(
        "kziban_admin_session",
        adminSession
      );


      document
        .getElementById(
          "adminUsername"
        )
        .value = "";

      document
        .getElementById(
          "adminPassword"
        )
        .value = "";

      closeAdminLogin();

      showAdminPanel();

      notify(
        "管理者としてログインしました"
      );

    } catch (error) {

      console.error(error);

      notify(
        "ログインに失敗しました: " +
        error.message
      );
    }
  }


  /*
   * =========================================================
   * 管理者認証確認
   * =========================================================
   */

  async function checkAdminSession() {

    if (!adminSession) {
      return false;
    }

    try {

      const result =
        await apiFetch(
          "/api/admin/check"
        );

      if (
        result.authenticated
      ) {

        showAdminPanel();

        return true;
      }

    } catch (error) {

      console.error(error);
    }


    adminSession = null;

    sessionStorage.removeItem(
      "kziban_admin_session"
    );

    return false;
  }


  /*
   * =========================================================
   * 管理画面表示
   * =========================================================
   */

  function showAdminPanel() {

    document
      .getElementById(
        "adminPanel"
      )
      .style.display = "block";

    document
      .getElementById(
        "adminButton"
      )
      .style.display = "none";

    document
      .getElementById(
        "logoutButton"
      )
      .style.display = "block";

    loadStats();
    loadAdminPosts();
  }


  /*
   * =========================================================
   * 管理者ログアウト
   * =========================================================
   */

  async function adminLogout() {

    try {

      if (adminSession) {

        await apiFetch(
          "/api/admin/logout",
          {
            method: "POST"
          }
        );
      }

    } catch (error) {

      console.error(error);

    } finally {

      adminSession = null;

      sessionStorage.removeItem(
        "kziban_admin_session"
      );

      document
        .getElementById(
          "adminPanel"
        )
        .style.display = "none";

      document
        .getElementById(
          "adminButton"
        )
        .style.display = "block";

      document
        .getElementById(
          "logoutButton"
        )
        .style.display = "none";

      notify(
        "ログアウトしました"
      );
    }
  }


  /*
   * =========================================================
   * 統計
   * =========================================================
   */

  async function loadStats() {

    try {

      const stats =
        await apiFetch(
          "/api/admin/stats"
        );

      document.getElementById(
        "statTotal"
      ).textContent =
        Number(
          stats.total_posts
        ).toLocaleString();

      document.getElementById(
        "statParent"
      ).textContent =
        Number(
          stats.parent_posts
        ).toLocaleString();

      document.getElementById(
        "statReplies"
      ).textContent =
        Number(
          stats.replies
        ).toLocaleString();

      document.getElementById(
        "statCharacters"
      ).textContent =
        Number(
          stats.total_characters
        ).toLocaleString();

      document.getElementById(
        "statToday"
      ).textContent =
        Number(
          stats.today_posts
        ).toLocaleString();

      document.getElementById(
        "statMonth"
      ).textContent =
        Number(
          stats.this_month_posts
        ).toLocaleString();

      document.getElementById(
        "statAverage"
      ).textContent =
        Number(
          stats.average_characters
        ).toFixed(1);

    } catch (error) {

      console.error(error);

      notify(
        "統計情報の取得に失敗しました"
      );
    }
  }


  /*
   * =========================================================
   * 管理者投稿一覧
   * =========================================================
   */

  async function loadAdminPosts() {

    if (!adminSession) {
      return;
    }

    const container =
      document.getElementById(
        "adminPosts"
      );

    container.innerHTML =
      `<div class="loading">
        読み込み中...
      </div>`;

    try {

      const results =
        await apiFetch(
          "/api/admin/posts"
        );

      renderAdminPosts(
        results
      );

    } catch (error) {

      console.error(error);

      container.innerHTML =
        `<div class="empty">
          投稿一覧の取得に失敗しました。
          <br>
          ${escapeHTML(error.message)}
        </div>`;
    }
  }


  function renderAdminPosts(
    results
  ) {

    const container =
      document.getElementById(
        "adminPosts"
      );

    if (
      !results ||
      results.length === 0
    ) {

      container.innerHTML =
        `<div class="empty">
          投稿がありません。
        </div>`;

      return;
    }


    let html = "";

    for (
      const post of results
    ) {

      const deleted =
        Number(post.deleted) === 1;

      html += `
        <article
          class="admin-post ${
            deleted ? "deleted" : ""
          }"
        >

          <div class="admin-post-header">

            <div>
              <strong>
                No.${escapeHTML(post.id)}
              </strong>

              ${
                deleted
                  ? `
                    <span
                      style="
                        color:#c62828;
                        font-weight:bold;
                        margin-left:8px;
                      "
                    >
                      削除済み
                    </span>
                  `
                  : ""
              }

            </div>

            <div class="admin-post-info">
              ${escapeHTML(
                formatDate(
                  post.created_at
                )
              )}
            </div>

          </div>

          <div class="admin-post-info">
            名前:
            ${escapeHTML(post.name)}

            ${
              post.parent_id !== null
                ? `
                  /
                  親投稿:
                  No.${escapeHTML(
                    post.parent_id
                  )}
                `
                : ""
            }
          </div>

          <div class="admin-post-message">
            ${escapeHTML(post.message)}
          </div>

          <div class="admin-post-actions">

            ${
              deleted
                ? `
                  <button
                    class="success-button"
                    onclick="restorePost(${Number(post.id)})"
                  >
                    復活
                  </button>
                `
                : `
                  <button
                    class="danger-button"
                    onclick="deletePost(${Number(post.id)})"
                  >
                    削除
                  </button>
                `
            }

          </div>

        </article>
      `;
    }

    container.innerHTML =
      html;
  }


  /*
   * =========================================================
   * 投稿削除
   * =========================================================
   */

  async function deletePost(id) {

    const confirmed =
      confirm(
        `No.${id} を削除しますか？\n\nこの操作は管理者画面から復活できます。`
      );

    if (!confirmed) {
      return;
    }


    try {

      await apiFetch(
        `/api/admin/posts/${id}`,
        {
          method: "DELETE"
        }
      );

      notify(
        `No.${id} を削除しました`
      );

      await loadPosts();
      await loadAdminPosts();
      await loadStats();

    } catch (error) {

      console.error(error);

      notify(
        "削除に失敗しました: " +
        error.message
      );
    }
  }


  /*
   * =========================================================
   * 投稿復活
   * =========================================================
   */

  async function restorePost(id) {

    const confirmed =
      confirm(
        `No.${id} を復活させますか？`
      );

    if (!confirmed) {
      return;
    }


    try {

      await apiFetch(
        `/api/admin/posts/${id}/restore`,
        {
          method: "POST"
        }
      );

      notify(
        `No.${id} を復活させました`
      );

      await loadPosts();
      await loadAdminPosts();
      await loadStats();

    } catch (error) {

      console.error(error);

      notify(
        "復活に失敗しました: " +
        error.message
      );
    }
  }


  /*
   * =========================================================
   * データベース全消去
   * =========================================================
   */

  async function wipeDatabase() {

    const first =
      confirm(
        "本当にデータベースを全消去しますか？\n\npostsテーブルの全投稿が物理削除されます。"
      );

    if (!first) {
      return;
    }


    const second =
      prompt(
        "確認のため「DELETE」と入力してください。"
      );

    if (
      second !== "DELETE"
    ) {

      notify(
        "全消去をキャンセルしました"
      );

      return;
    }


    try {

      const result =
        await apiFetch(
          "/api/admin/wipe",
          {
            method: "POST"
          }
        );

      notify(
        `${result.deleted_count}件を削除しました`
      );

      await loadPosts();
      await loadAdminPosts();
      await loadStats();

    } catch (error) {

      console.error(error);

      notify(
        "データベースの全消去に失敗しました: " +
        error.message
      );
    }
  }


  /*
   * =========================================================
   * JSONバックアップ書き出し
   * =========================================================
   *
   * 管理者用投稿一覧には削除済み投稿も含まれるので、
   * それをそのままバックアップとして保存します。
   */

  async function exportBackup() {

    try {

      const results =
        await apiFetch(
          "/api/admin/posts"
        );

      const backup = {

        version: 1,

        exported_at:
          new Date().toISOString(),

        posts: results.map(
          post => ({
            id:
              Number(post.id),

            parent_id:
              post.parent_id === null
                ? null
                : Number(
                    post.parent_id
                  ),

            name:
              post.name,

            message:
              post.message,

            created_at:
              post.created_at,

            deleted:
              Number(post.deleted)
          })
        )

      };


      const json =
        JSON.stringify(
          backup,
          null,
          2
        );

      const blob =
        new Blob(
          [json],
          {
            type:
              "application/json"
          }
        );

      const url =
        URL.createObjectURL(
          blob
        );

      const a =
        document.createElement(
          "a"
        );

      const date =
        new Date()
          .toISOString()
          .replaceAll(":", "-")
          .replace(/\..+/, "");

      a.href = url;

      a.download =
        `kziban-backup-${date}.json`;

      document
        .body
        .appendChild(a);

      a.click();

      a.remove();

      URL.revokeObjectURL(
        url
      );

      notify(
        "バックアップを書き出しました"
      );

    } catch (error) {

      console.error(error);

      notify(
        "バックアップの作成に失敗しました: " +
        error.message
      );
    }
  }


  /*
   * =========================================================
   * JSONバックアップ読み込み
   * =========================================================
   */

  async function importBackup(event) {

    const file =
      event.target.files?.[0];

    /*
     * 同じファイルを再選択できるようにする
     */

    event.target.value = "";

    if (!file) {
      return;
    }


    try {

      const text =
        await file.text();

      const data =
        JSON.parse(text);


      if (
        !data ||
        !Array.isArray(
          data.posts
        )
      ) {

        throw new Error(
          "バックアップデータの形式が不正です"
        );
      }


      const count =
        data.posts.length;


      const confirmed =
        confirm(
          `このバックアップを読み込みますか？\n\n${count}件の投稿で現在のデータを置き換えます。`
        );

      if (!confirmed) {
        return;
      }


      /*
       * もう一度確認。
       */

      const second =
        prompt(
          "確認のため「IMPORT」と入力してください。"
        );

      if (
        second !== "IMPORT"
      ) {

        notify(
          "読み込みをキャンセルしました"
        );

        return;
      }


      const result =
        await apiFetch(
          "/api/admin/import",
          {
            method: "POST",
            headers: {
              "Content-Type":
                "application/json"
            },
            body:
              JSON.stringify({
                posts:
                  data.posts
              })
          }
        );


      notify(
        `${result.imported_count}件の投稿を読み込みました`
      );

      await loadPosts();
      await loadAdminPosts();
      await loadStats();

    } catch (error) {

      console.error(error);

      notify(
        "バックアップの読み込みに失敗しました: " +
        error.message
      );
    }
  }


  /*
   * =========================================================
   * イベント
   * =========================================================
   */

  document
    .getElementById("message")
    .addEventListener(
      "input",
      updateCharCount
    );


  /*
   * Enterでログイン
   */

  document
    .getElementById("adminPassword")
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          adminLogin();
        }
      }
    );


  /*
   * モーダル外クリック
   */

  document
    .getElementById("loginModal")
    .addEventListener(
      "click",
      event => {

        if (
          event.target ===
          event.currentTarget
        ) {

          closeAdminLogin();
        }
      }
    );


  /*
   * =========================================================
   * 初期化
   * =========================================================
   */

  async function initialize() {

    updateCharCount();

    await loadPosts();

    await checkAdminSession();
  }


  initialize();

</script>
