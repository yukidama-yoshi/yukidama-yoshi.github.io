<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <title>管理者パネル - ゆきだまのホームページ</title>

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/bbs.css">

  <style>

    /* =========================================
       認証確認中
       ========================================= */

    #page-content {
      display: none;
    }


    #loading {
      padding: 40px;
      text-align: left;
    }


    /* =========================================
       管理画面
       ========================================= */

    .admin-panel {
      max-width: 800px;
    }


    .admin-box {
      border: 1px solid #ccc;
      background: rgba(255,255,255,0.8);
      padding: 15px;
      margin-bottom: 20px;
    }


    .admin-box h2 {
      font-size: 18px;
      margin-top: 0;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }


    /* =========================================
       統計
       ========================================= */

    .stats-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(200px, 1fr));

      gap: 10px;
    }


    .stat-item {
      border: 1px solid #ccc;
      background: #fff;
      padding: 10px;
    }


    .stat-label {
      font-size: 13px;
      color: #555;
    }


    .stat-value {
      font-size: 22px;
      font-weight: bold;
      margin-top: 3px;
    }


    .stat-unit {
      font-size: 13px;
      font-weight: normal;
    }


    /* =========================================
       ボタン
       ========================================= */

    .admin-button {
      cursor: pointer;
      padding: 5px 12px;
      font-family:
        "MS Gothic",
        "Osaka",
        monospace;
    }


    .admin-button:disabled {
      cursor: default;
    }


    #stats-message {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
    }


    /* =========================================
       スマホなど
       ========================================= */

    @media (max-width: 600px) {

      .stats-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <div class="version-tag">
    Ver 1.6
  </div>


  <nav
    class="sidebar"
    id="sidebar"
  ></nav>


  <div
    class="resizer"
    id="resizer"
  ></div>


  <!-- =========================================
       認証確認中
       ========================================= -->

  <div id="loading">

    管理者認証を確認しています...

  </div>



  <!-- =========================================
       ページ本体
       ========================================= -->

  <div
    class="main"
    id="page-content"
  >

    <h1>
      管理者パネル
    </h1>


    <div class="admin-panel">


      <!-- =====================================
           統計情報
           ===================================== -->

      <div class="admin-box">

        <h2>
          掲示板統計
        </h2>


        <div class="stats-grid">


          <div class="stat-item">

            <div class="stat-label">
              総投稿数
            </div>

            <div
              class="stat-value"
              id="total-posts"
            >
              -
            </div>

          </div>


          <div class="stat-item">

            <div class="stat-label">
              親投稿数
            </div>

            <div
              class="stat-value"
              id="parent-posts"
            >
              -
            </div>

          </div>


          <div class="stat-item">

            <div class="stat-label">
              返信数
            </div>

            <div
              class="stat-value"
              id="replies"
            >
              -
            </div>

          </div>


          <div class="stat-item">

            <div class="stat-label">
              総文字数
            </div>

            <div
              class="stat-value"
              id="total-characters"
            >
              -
              <span class="stat-unit">
                文字
              </span>
            </div>

          </div>


          <div class="stat-item">

            <div class="stat-label">
              平均文字数
            </div>

            <div
              class="stat-value"
              id="average-characters"
            >
              -
              <span class="stat-unit">
                文字
              </span>
            </div>

          </div>


          <div class="stat-item">

            <div class="stat-label">
              今日の投稿数
            </div>

            <div
              class="stat-value"
              id="today-posts"
            >
              -
            </div>

          </div>


          <div class="stat-item">

            <div class="stat-label">
              今月の投稿数
            </div>

            <div
              class="stat-value"
              id="month-posts"
            >
              -
            </div>

          </div>


        </div>


        <div style="margin-top:15px;">

          <button
            id="reload-stats"
            class="admin-button"
          >
            統計を更新
          </button>

        </div>


        <div
          id="stats-message"
          style="display:none;"
        ></div>


      </div>



      <!-- =====================================
           管理メニュー
           ===================================== -->

      <div class="admin-box">

        <h2>
          管理メニュー
        </h2>


        <p>
          現在は統計情報のみ利用できます。
        </p>


        <p>
          投稿管理・削除機能は後から追加します。
        </p>


        <button
          id="logout-button"
          class="admin-button"
        >
          ログアウト
        </button>

      </div>


    </div>



    <hr>


    <p>
      <a href="bbs.html">
        掲示板へ戻る
      </a>
    </p>


    <footer>

      <p>
        © 2026 ゆきだま.
        All rights reserved.
      </p>

    </footer>

  </div>



  <script src="js/load-sidebar.js"></script>


  <script>

    /* =====================================================
       設定
       ===================================================== */

    const API_URL =
      "https://kziban-api.y-bb0.workers.dev";


    const SESSION_KEY =
      "kziban_admin_session";



    /* =====================================================
       セッション取得
       ===================================================== */

    function getSession() {

      return sessionStorage.getItem(
        SESSION_KEY
      );

    }



    /* =====================================================
       認証確認
       ===================================================== */

    async function checkSession() {

      const session =
        getSession();


      if (!session) {

        showLoginRequired();

        return false;

      }


      try {

        const response =
          await fetch(
            API_URL +
            "/api/admin/check",
            {
              method: "GET",

              headers: {
                "Authorization":
                  "Bearer " + session
              }
            }
          );


        if (!response.ok) {

          sessionStorage.removeItem(
            SESSION_KEY
          );

          showLoginRequired();

          return false;

        }


        const result =
          await response.json();


        if (
          result.authenticated !== true
        ) {

          sessionStorage.removeItem(
            SESSION_KEY
          );

          showLoginRequired();

          return false;

        }


        /*
         * 認証成功
         */

        document.getElementById(
          "loading"
        ).style.display = "none";


        document.getElementById(
          "page-content"
        ).style.display = "block";


        return true;


      } catch (error) {

        console.error(error);

        showLoginRequired();

        return false;

      }

    }



    /* =====================================================
       未ログイン時
       ===================================================== */

    function showLoginRequired() {

      document.getElementById(
        "loading"
      ).textContent =
        "管理者ログインが必要です。";


      /*
       * 少し待ってからログインページへ
       */

      setTimeout(() => {

        window.location.href =
          "ykadm_panel_1xyk5d.html";

      }, 1000);

    }



    /* =====================================================
       統計取得
       ===================================================== */

    async function loadStats() {

      const session =
        getSession();


      if (!session) {

        return;

      }


      const message =
        document.getElementById(
          "stats-message"
        );


      const reloadButton =
        document.getElementById(
          "reload-stats"
        );


      message.style.display =
        "none";


      reloadButton.disabled =
        true;

      reloadButton.textContent =
        "読み込み中...";


      try {

        const response =
          await fetch(
            API_URL +
            "/api/admin/stats",
            {
              method: "GET",

              headers: {
                "Authorization":
                  "Bearer " + session
              }
            }
          );


        if (
          response.status === 401
        ) {

          sessionStorage.removeItem(
            SESSION_KEY
          );

          window.location.reload();

          return;

        }


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const stats =
          await response.json();


        /*
         * 数値表示
         */

        document.getElementById(
          "total-posts"
        ).textContent =
          stats.total_posts.toLocaleString(
            "ja-JP"
          );


        document.getElementById(
          "parent-posts"
        ).textContent =
          stats.parent_posts.toLocaleString(
            "ja-JP"
          );


        document.getElementById(
          "replies"
        ).textContent =
          stats.replies.toLocaleString(
            "ja-JP"
          );


        document.getElementById(
          "total-characters"
        ).innerHTML =
          stats.total_characters.toLocaleString(
            "ja-JP"
          ) +
          '<span class="stat-unit">文字</span>';


        document.getElementById(
          "average-characters"
        ).innerHTML =
          Number(
            stats.average_characters
          ).toFixed(1) +
          '<span class="stat-unit">文字</span>';


        document.getElementById(
          "today-posts"
        ).textContent =
          stats.today_posts.toLocaleString(
            "ja-JP"
          );


        document.getElementById(
          "month-posts"
        ).textContent =
          stats.this_month_posts.toLocaleString(
            "ja-JP"
          );


        message.textContent =
          "更新しました。";

        message.style.display =
          "block";


      } catch (error) {

        console.error(error);

        message.textContent =
          "統計情報の取得に失敗しました。";

        message.style.display =
          "block";

      }


      reloadButton.disabled =
        false;

      reloadButton.textContent =
        "統計を更新";

    }



    /* =====================================================
       ログアウト
       ===================================================== */

    document
      .getElementById("logout-button")
      .addEventListener(
        "click",
        async () => {

          const session =
            getSession();


          if (session) {

            try {

              await fetch(
                API_URL +
                "/api/admin/logout",
                {
                  method: "POST",

                  headers: {
                    "Authorization":
                      "Bearer " + session
                  }
                }
              );

            } catch (error) {

              console.error(error);

            }

          }


          sessionStorage.removeItem(
            SESSION_KEY
          );


          window.location.reload();

        }
      );



    /* =====================================================
       統計更新ボタン
       ===================================================== */

    document
      .getElementById("reload-stats")
      .addEventListener(
        "click",
        loadStats
      );



    /* =====================================================
       サイドバーリサイズ
       ===================================================== */

    const resizer =
      document.getElementById(
        "resizer"
      );


    const sidebarEl =
      document.getElementById(
        "sidebar"
      );


    let isResizing =
      false;


    resizer.addEventListener(
      "mousedown",
      () => {

        isResizing =
          true;

        document.body.style.cursor =
          "ew-resize";

      }
    );


    document.addEventListener(
      "mousemove",
      (e) => {

        if (!isResizing) {

          return;

        }


        if (
          e.clientX > 100 &&
          e.clientX < 600
        ) {

          sidebarEl.style.width =
            e.clientX + "px";

        }

      }
    );


    document.addEventListener(
      "mouseup",
      () => {

        isResizing =
          false;

        document.body.style.cursor =
          "default";

      }
    );



    /* =====================================================
       初期処理
       ===================================================== */

    async function initialize() {

      const authenticated =
        await checkSession();


      if (!authenticated) {

        return;

      }


      await loadStats();

    }


    initialize();

  </script>


</body>
</html>
