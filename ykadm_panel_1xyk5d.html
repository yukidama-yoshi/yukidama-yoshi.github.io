<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <title>管理者パネル - ゆきだまのホームページ</title>

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/bbs.css">

  <style>

    /* =========================================
       認証確認中
       ========================================= */

    #page-content {
      display: none;
    }


    #loading {
      padding: 40px;
    }


    /* =========================================
       管理画面
       ========================================= */

    .admin-panel {
      max-width: 900px;
    }


    .admin-box {
      border: 1px solid #ccc;
      background: rgba(255,255,255,0.8);
      padding: 15px;
      margin-bottom: 20px;
    }


    .admin-box h2 {
      font-size: 18px;
      margin-top: 0;
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }


    /* =========================================
       統計
       ========================================= */

    .stats-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(200px, 1fr));

      gap: 10px;
    }


    .stat-item {
      border: 1px solid #ccc;
      background: #fff;
      padding: 10px;
    }


    .stat-label {
      font-size: 13px;
      color: #555;
    }


    .stat-value {
      font-size: 22px;
      font-weight: bold;
      margin-top: 3px;
    }


    .stat-unit {
      font-size: 13px;
      font-weight: normal;
    }


    /* =========================================
       ボタン
       ========================================= */

    .admin-button {
      cursor: pointer;
      padding: 5px 12px;
      font-family:
        "MS Gothic",
        "Osaka",
        monospace;
    }


    .admin-button:disabled {
      cursor: default;
    }


    /* =========================================
       投稿管理
       ========================================= */

    .post-filter {
      margin-bottom: 15px;
    }


    .post-filter button {
      margin-right: 5px;
      margin-bottom: 5px;
      cursor: pointer;
    }


    .admin-post {
      border-bottom: 1px dotted #999;
      padding: 15px 0;
    }


    .admin-post-header {
      font-size: 14px;
      color: #555;
      margin-bottom: 8px;
    }


    .admin-post-message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      margin-bottom: 10px;
    }


    .admin-post-info {
      font-size: 12px;
      color: #777;
      margin-bottom: 8px;
    }


    .deleted-post {
      opacity: 0.65;
      background: #f5f5f5;
      padding: 10px;
    }


    .deleted-label {
      color: #a00;
      font-weight: bold;
    }


    #stats-message,
    #posts-message {
      margin-top: 10px;
      font-size: 13px;
      color: #555;
    }


    /* =========================================
       スマホ
       ========================================= */

    @media (max-width: 600px) {

      .stats-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


  <div class="version-tag">
    Ver 1.6
  </div>


  <nav
    class="sidebar"
    id="sidebar"
  ></nav>


  <div
    class="resizer"
    id="resizer"
  ></div>



  <!-- =========================================
       認証確認中
       ========================================= -->

  <div id="loading">

    管理者認証を確認しています...

  </div>



  <!-- =========================================
       管理画面本体
       ========================================= -->

  <div
    class="main"
    id="page-content"
  >

    <h1>
      管理者パネル
    </h1>


    <p>
      掲示板の管理を行います。
    </p>



    <div class="admin-panel">


      <!-- =====================================
           統計情報
           ===================================== -->

      <div class="admin-box">

        <h2>
          掲示板統計
        </h2>


        <div class="stats-grid">


          <div class="stat-item">

            <div class="stat-label">
              総投稿数
            </div>

            <div
              class="stat-value"
              id="total-posts"
            >
              -
            </div>

          </div>


          <div class="stat-item">

            <div class="stat-label">
              親投稿数
            </div>

            <div
              class="stat-value"
              id="parent-posts"
            >
              -
            </div>

          </div>


          <div class="stat-item">

            <div class="stat-label">
              返信数
            </div>

            <div
              class="stat-value"
              id="replies"
            >
              -
            </div>

          </div>


          <div class="stat-item">

            <div class="stat-label">
              総文字数
            </div>

            <div
              class="stat-value"
              id="total-characters"
            >
              -
            </div>

          </div>


          <div class="stat-item">

            <div class="stat-label">
              平均文字数
            </div>

            <div
              class="stat-value"
              id="average-characters"
            >
              -
            </div>

          </div>


          <div class="stat-item">

            <div class="stat-label">
              今日の投稿数
            </div>

            <div
              class="stat-value"
              id="today-posts"
            >
              -
            </div>

          </div>


          <div class="stat-item">

            <div class="stat-label">
              今月の投稿数
            </div>

            <div
              class="stat-value"
              id="month-posts"
            >
              -
            </div>

          </div>


          <div class="stat-item">

            <div class="stat-label">
              投稿データ容量（概算）
            </div>

            <div
              class="stat-value"
              id="estimated-size"
            >
              -
            </div>

          </div>


        </div>


        <div style="margin-top:15px;">

          <button
            id="reload-stats"
            class="admin-button"
          >
            統計を更新
          </button>

        </div>


        <div
          id="stats-message"
          style="display:none;"
        ></div>

      </div>



      <!-- =====================================
           投稿管理
           ===================================== -->

      <div class="admin-box">

        <h2>
          投稿管理
        </h2>


        <div class="post-filter">

          <button
            class="admin-button"
            data-filter="all"
          >
            すべて
          </button>

          <button
            class="admin-button"
            data-filter="active"
          >
            公開中
          </button>

          <button
            class="admin-button"
            data-filter="deleted"
          >
            削除済み
          </button>

        </div>


        <div
          id="admin-posts"
        >
          読み込み中...
        </div>


        <div
          id="posts-message"
          style="display:none;"
        ></div>

      </div>



      <!-- =====================================
           管理者操作
           ===================================== -->

      <div class="admin-box">

        <h2>
          管理者操作
        </h2>


        <button
          id="logout-button"
          class="admin-button"
        >
          ログアウト
        </button>

      </div>


    </div>



    <hr>


    <p>
      <a href="bbs.html">
        掲示板へ戻る
      </a>
    </p>


    <footer>

      <p>
        © 2026 ゆきだま.
        All rights reserved.
      </p>

    </footer>

  </div>



  <script src="js/load-sidebar.js"></script>


  <script>

    /* =====================================================
       設定
       ===================================================== */

    const API_URL =
      "https://kziban-api.y-bb0.workers.dev";


    const SESSION_KEY =
      "kziban_admin_session";


    let adminPosts = [];

    let currentFilter =
      "all";



    /* =====================================================
       セッション
       ===================================================== */

    function getSession() {

      return sessionStorage.getItem(
        SESSION_KEY
      );

    }



    /* =====================================================
       認証確認
       ===================================================== */

    async function checkSession() {

      const session =
        getSession();


      if (!session) {

        showLoginRequired();

        return false;

      }


      try {

        const response =
          await fetch(
            API_URL +
            "/api/admin/check",
            {
              method: "GET",

              headers: {
                "Authorization":
                  "Bearer " + session
              }
            }
          );


        if (!response.ok) {

          sessionStorage.removeItem(
            SESSION_KEY
          );

          showLoginRequired();

          return false;

        }


        const result =
          await response.json();


        if (
          result.authenticated !== true
        ) {

          sessionStorage.removeItem(
            SESSION_KEY
          );

          showLoginRequired();

          return false;

        }


        /*
         * 認証成功
         */

        document.getElementById(
          "loading"
        ).style.display =
          "none";


        document.getElementById(
          "page-content"
        ).style.display =
          "block";


        return true;


      } catch (error) {

        console.error(error);

        showLoginRequired();

        return false;

      }

    }



    /* =====================================================
       ログイン要求
       ===================================================== */

    function showLoginRequired() {

      document.getElementById(
        "loading"
      ).textContent =
        "管理者ログインが必要です。";


      setTimeout(() => {

        window.location.href =
          "ykadm_panel_1xyk5d.html";

      }, 1000);

    }



    /* =====================================================
       統計情報
       ===================================================== */

    async function loadStats() {

      const session =
        getSession();


      if (!session) {
        return;
      }


      const message =
        document.getElementById(
          "stats-message"
        );


      const button =
        document.getElementById(
          "reload-stats"
        );


      message.style.display =
        "none";


      button.disabled =
        true;

      button.textContent =
        "読み込み中...";


      try {

        const response =
          await fetch(
            API_URL +
            "/api/admin/stats",
            {
              method: "GET",

              headers: {
                "Authorization":
                  "Bearer " + session
              }
            }
          );


        if (
          response.status === 401
        ) {

          sessionStorage.removeItem(
            SESSION_KEY
          );

          window.location.reload();

          return;

        }


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        const stats =
          await response.json();


        document.getElementById(
          "total-posts"
        ).textContent =
          stats.total_posts
            .toLocaleString("ja-JP") +
          " 件";


        document.getElementById(
          "parent-posts"
        ).textContent =
          stats.parent_posts
            .toLocaleString("ja-JP") +
          " 件";


        document.getElementById(
          "replies"
        ).textContent =
          stats.replies
            .toLocaleString("ja-JP") +
          " 件";


        document.getElementById(
          "total-characters"
        ).textContent =
          stats.total_characters
            .toLocaleString("ja-JP") +
          " 文字";


        document.getElementById(
          "average-characters"
        ).textContent =
          Number(
            stats.average_characters
          ).toFixed(1) +
          " 文字";


        document.getElementById(
          "today-posts"
        ).textContent =
          stats.today_posts
            .toLocaleString("ja-JP") +
          " 件";


        document.getElementById(
          "month-posts"
        ).textContent =
          stats.this_month_posts
            .toLocaleString("ja-JP") +
          " 件";


        /*
         * 投稿データ容量の概算
         *
         * 現在はWorkerから総文字数を取得しているため、
         * 1文字あたり3バイトとして単純計算します。
         *
         * 日本語を含むUTF-8では実際のサイズと
         * 完全には一致しないため「概算」です。
         */

        const estimatedBytes =
          stats.total_characters * 3;


        document.getElementById(
          "estimated-size"
        ).textContent =
          formatBytes(
            estimatedBytes
          );


        message.textContent =
          "更新しました。";

        message.style.display =
          "block";


      } catch (error) {

        console.error(error);

        message.textContent =
          "統計情報の取得に失敗しました。";

        message.style.display =
          "block";

      }


      button.disabled =
        false;

      button.textContent =
        "統計を更新";

    }



    /* =====================================================
       バイト数 → KB / MB / GB
       ===================================================== */

    function formatBytes(bytes) {

      if (bytes < 1024) {

        return (
          bytes.toLocaleString(
            "ja-JP"
          ) +
          " B"
        );

      }


      if (
        bytes <
        1024 * 1024
      ) {

        return (
          (bytes / 1024)
            .toFixed(2) +
          " KB"
        );

      }


      if (
        bytes <
        1024 * 1024 * 1024
      ) {

        return (
          (bytes / 1024 / 1024)
            .toFixed(2) +
          " MB"
        );

      }


      return (
        (bytes /
          1024 /
          1024 /
          1024)
          .toFixed(2) +
        " GB"
      );

    }



    /* =====================================================
       管理者用投稿一覧
       ===================================================== */

    async function loadAdminPosts() {

      const session =
        getSession();


      if (!session) {
        return;
      }


      const postsArea =
        document.getElementById(
          "admin-posts"
        );


      postsArea.textContent =
        "読み込み中...";


      try {

        const response =
          await fetch(
            API_URL +
            "/api/admin/posts",
            {
              method: "GET",

              headers: {
                "Authorization":
                  "Bearer " + session
              }
            }
          );


        if (
          response.status === 401
        ) {

          sessionStorage.removeItem(
            SESSION_KEY
          );

          window.location.reload();

          return;

        }


        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }


        adminPosts =
          await response.json();


        renderAdminPosts();


      } catch (error) {

        console.error(error);

        postsArea.textContent =
          "投稿一覧の取得に失敗しました。";

      }

    }



    /* =====================================================
       投稿一覧表示
       ===================================================== */

    function renderAdminPosts() {

      const postsArea =
        document.getElementById(
          "admin-posts"
        );


      postsArea.innerHTML =
        "";


      let filteredPosts;


      if (
        currentFilter === "active"
      ) {

        filteredPosts =
          adminPosts.filter(
            post =>
              post.deleted === 0
          );

      } else if (
        currentFilter === "deleted"
      ) {

        filteredPosts =
          adminPosts.filter(
            post =>
              post.deleted === 1
          );

      } else {

        filteredPosts =
          adminPosts;

      }


      if (
        filteredPosts.length === 0
      ) {

        postsArea.textContent =
          "該当する投稿はありません。";

        return;

      }


      filteredPosts.forEach(
        post => {

          postsArea.appendChild(
            createAdminPostElement(
              post
            )
          );

        }
      );

    }



    /* =====================================================
       管理用投稿要素
       ===================================================== */

    function createAdminPostElement(
      post
    ) {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "admin-post";


      if (
        post.deleted === 1
      ) {

        div.classList.add(
          "deleted-post"
        );

      }


      const header =
        document.createElement(
          "div"
        );


      header.className =
        "admin-post-header";


      header.textContent =
        "ID " +
        post.id +
        "　" +
        post.name +
        "　" +
        new Date(
          post.created_at
        ).toLocaleString(
          "ja-JP"
        );


      div.appendChild(
        header
      );


      const info =
        document.createElement(
          "div"
        );


      info.className =
        "admin-post-info";


      info.textContent =
        post.parent_id === null
          ? "親投稿"
          : "返信（親投稿ID: " +
            post.parent_id +
            "）";


      div.appendChild(
        info
      );


      const message =
        document.createElement(
          "div"
        );


      message.className =
        "admin-post-message";


      message.textContent =
        post.message;


      div.appendChild(
        message
      );


      if (
        post.deleted === 1
      ) {

        const deletedLabel =
          document.createElement(
            "div"
          );


        deletedLabel.className =
          "deleted-label";


        deletedLabel.textContent =
          "削除済み";


        div.appendChild(
          deletedLabel
        );

      } else {

        const deleteButton =
          document.createElement(
            "button"
          );


        deleteButton.className =
          "admin-button";


        deleteButton.textContent =
          "削除";


        deleteButton.addEventListener(
          "click",
          () => {

            deletePost(
              post.id
            );

          }
        );


        div.appendChild(
          deleteButton
        );

      }


      return div;

    }



    /* =====================================================
       投稿削除
       ===================================================== */

    async function deletePost(
      id
    ) {

      const confirmed =
        confirm(
          "投稿ID " +
          id +
          " を削除しますか？\n\n" +
          "削除後は通常の掲示板には表示されなくなります。"
        );


      if (!confirmed) {

        return;

      }


      const session =
        getSession();


      if (!session) {

        alert(
          "ログイン状態が無効です。"
        );

        window.location.reload();

        return;

      }


      try {

        const response =
          await fetch(
            API_URL +
            "/api/admin/posts/" +
            id,
            {
              method: "DELETE",

              headers: {
                "Authorization":
                  "Bearer " + session
              }
            }
          );


        const result =
          await response.json();


        if (
          response.status === 401
        ) {

          sessionStorage.removeItem(
            SESSION_KEY
          );

          window.location.reload();

          return;

        }


        if (
          !response.ok ||
          result.success !== true
        ) {

          alert(
            "投稿の削除に失敗しました。"
          );

          return;

        }


        /*
         * 一覧を再取得
         */

        await loadAdminPosts();


        /*
         * 統計も更新
         */

        await loadStats();


      } catch (error) {

        console.error(error);

        alert(
          "通信エラーが発生しました。"
        );

      }

    }



    /* =====================================================
       フィルター
       ===================================================== */

    document
      .querySelectorAll(
        "[data-filter]"
      )
      .forEach(
        button => {

          button.addEventListener(
            "click",
            () => {

              currentFilter =
                button.dataset.filter;

              renderAdminPosts();

            }
          );

        }
      );



    /* =====================================================
       統計更新
       ===================================================== */

    document
      .getElementById(
        "reload-stats"
      )
      .addEventListener(
        "click",
        loadStats
      );



    /* =====================================================
       ログアウト
       ===================================================== */

    document
      .getElementById(
        "logout-button"
      )
      .addEventListener(
        "click",
        async () => {

          const session =
            getSession();


          if (session) {

            try {

              await fetch(
                API_URL +
                "/api/admin/logout",
                {
                  method: "POST",

                  headers: {
                    "Authorization":
                      "Bearer " +
                      session
                  }
                }
              );

            } catch (error) {

              console.error(error);

            }

          }


          sessionStorage.removeItem(
            SESSION_KEY
          );


          window.location.reload();

        }
      );



    /* =====================================================
       サイドバーリサイズ
       ===================================================== */

    const resizer =
      document.getElementById(
        "resizer"
      );


    const sidebarEl =
      document.getElementById(
        "sidebar"
      );


    let isResizing =
      false;


    resizer.addEventListener(
      "mousedown",
      () => {

        isResizing =
          true;

        document.body.style.cursor =
          "ew-resize";

      }
    );


    document.addEventListener(
      "mousemove",
      (e) => {

        if (!isResizing) {
          return;
        }


        if (
          e.clientX > 100 &&
          e.clientX < 600
        ) {

          sidebarEl.style.width =
            e.clientX + "px";

        }

      }
    );


    document.addEventListener(
      "mouseup",
      () => {

        isResizing =
          false;

        document.body.style.cursor =
          "default";

      }
    );



    /* =====================================================
       初期化
       ===================================================== */

    async function initialize() {

      const authenticated =
        await checkSession();


      if (!authenticated) {
        return;
      }


      /*
       * 認証成功後に初めて
       * 管理画面のデータを取得
       */

      await Promise.all([
        loadStats(),
        loadAdminPosts()
      ]);

    }


    initialize();

  </script>


</body>
</html>
