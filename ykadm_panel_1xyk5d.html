<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>管理者ログイン - ゆきだまのホームページ</title>

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/bbs.css">
</head>

<body>

  <div class="version-tag">Ver 1.6</div>

  <nav class="sidebar" id="sidebar"></nav>

  <div class="resizer" id="resizer"></div>

  <div class="main">

    <h1>管理者ログイン</h1>

    <p>
      掲示板の管理者用ページです。管理ページを使う権限をお持ちの方は、以下に認証情報を入力してください。
    </p>


    <div class="bbs-form">

      <h2>ログイン</h2>

      <div class="admin-login-field">
        <label for="username">
          ユーザー名：
        </label>

        <input
          type="text"
          id="username"
          autocomplete="username"
        >
      </div>


      <br>


      <div class="admin-login-field">
        <label for="password">
          パスワード：
        </label>

        <input
          type="password"
          id="password"
          autocomplete="current-password"
        >
      </div>


      <br>


      <button id="login-button">
        ログイン
      </button>


      <p
        id="login-message"
        style="display:none;"
      ></p>

    </div>


    <hr>


    <p>
      <a href="bbs.html">掲示板へ戻る</a>
    </p>


    <footer>
      <p>© 2026 ゆきだま. All rights reserved.</p>
    </footer>

  </div>


  <script src="js/load-sidebar.js"></script>


  <script>
    /* ==========================
       サイドバーリサイズ機能
       ========================== */

    const resizer =
      document.getElementById('resizer');

    const sidebarEl =
      document.getElementById('sidebar');

    let isResizing = false;


    resizer.addEventListener(
      'mousedown',
      () => {

        isResizing = true;

        document.body.style.cursor =
          'ew-resize';

      }
    );


    document.addEventListener(
      'mousemove',
      (e) => {

        if (!isResizing) return;

        if (
          e.clientX > 100 &&
          e.clientX < 600
        ) {

          sidebarEl.style.width =
            e.clientX + 'px';

        }

      }
    );


    document.addEventListener(
      'mouseup',
      () => {

        isResizing = false;

        document.body.style.cursor =
          'default';

      }
    );


    /* ==========================
       管理者ログイン
       ========================== */

    const API_URL =
      "https://kziban-api.y-bb0.workers.dev/api/admin/login";


    const usernameInput =
      document.getElementById('username');

    const passwordInput =
      document.getElementById('password');

    const loginButton =
      document.getElementById('login-button');

    const loginMessage =
      document.getElementById('login-message');


    loginButton.addEventListener(
      'click',
      async () => {

        const username =
          usernameInput.value.trim();

        const password =
          passwordInput.value;


        /* 入力チェック */

        if (!username || !password) {

          loginMessage.textContent =
            "ユーザー名とパスワードを入力してください。";

          loginMessage.style.display =
            'block';

          return;

        }


        /* ボタンを一時的に無効化 */

        loginButton.disabled = true;

        loginButton.textContent =
          "ログイン中...";


        loginMessage.style.display =
          'none';


        try {

          const response =
            await fetch(
              API_URL,
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  username: username,
                  password: password
                })
              }
            );


          const result =
            await response.json();


          /* ==========================
             ログイン成功
             ========================== */

          if (
            response.ok &&
            result.success === true
          ) {

            loginMessage.textContent =
              "ログインに成功しました。";

            loginMessage.style.display =
              'block';


            /*
             * 現段階ではまだ
             * 管理画面へ移動しません。
             *
             * 次の段階でセッション認証を
             * 実装してから管理画面へ進めます。
             */

            return;

          }


          /* ==========================
             ログイン失敗
             ========================== */

          loginMessage.textContent =
            result.error ||
            "ユーザー名またはパスワードが違います。";

          loginMessage.style.display =
            'block';


        } catch (error) {

          console.error(error);

          loginMessage.textContent =
            "通信エラーが発生しました。";

          loginMessage.style.display =
            'block';

        }


        /* ボタンを元に戻す */

        loginButton.disabled = false;

        loginButton.textContent =
          "ログイン";

      }
    );


    /* Enterキーでもログイン */

    passwordInput.addEventListener(
      'keydown',
      (event) => {

        if (event.key === 'Enter') {

          loginButton.click();

        }

      }
    );

  </script>

</body>
</html>
