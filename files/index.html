<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ファイル一覧</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: sans-serif;
    background: #f4f4f4;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    border: 1px solid #ccc;
    padding: 20px;
}

h1 {
    margin-top: 0;
    font-size: 24px;
}

/* パンくず */
#breadcrumb {
    background: #eee;
    padding: 10px;
    margin-bottom: 15px;
    font-size: 14px;
}

.breadcrumb-item {
    color: #0066cc;
    cursor: pointer;
}

.breadcrumb-item:hover {
    text-decoration: underline;
}

/* 一覧 */
.header,
.item {
    display: grid;
    grid-template-columns: 40px minmax(0, 1fr) 120px;
    align-items: center;
}

.header {
    padding: 8px 10px;
    background: #ddd;
    border-bottom: 1px solid #aaa;
    font-weight: bold;
    user-select: none;
}

.item {
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.item:hover {
    background: #f0f8ff;
}

/* アイコン */
.icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.icon svg {
    width: 20px;
    height: 20px;
    fill: #555;
}

.name {
    min-width: 0;
}

.name a {
    color: #0066cc;
    text-decoration: none;
    cursor: pointer;
    word-break: break-all;
}

.name a:hover {
    text-decoration: underline;
}

.size {
    text-align: right;
    color: #666;
    font-size: 13px;
}

.loading {
    text-align: center;
    padding: 30px;
}

.error {
    color: red;
    padding: 20px;
}
</style>
</head>

<body>
<div class="container">

<h1>ファイル一覧</h1>

<div id="breadcrumb">ホーム</div>

<div class="header">
    <div></div>
    <div>名前</div>
    <div>サイズ</div>
</div>

<div id="list">
    <div class="loading">読み込み中...</div>
</div>

<script>
// GitHub Pages の raw ファイル URL
const RAW_BASE = "https://raw.githubusercontent.com/yukidama-yoshi/yukidama-yoshi.github.io/main";

// files.json を読み込む
async function loadFiles() {
    const list = document.getElementById("list");

    try {
        const response = await fetch("files.json");
        if (!response.ok) throw new Error("files.json を読み込めません");

        const files = await response.json();
        list.innerHTML = "";

        files.forEach(file => createItem(file));

        if (files.length === 0) {
            list.innerHTML = "<div class='loading'>ファイルがありません</div>";
        }

    } catch (error) {
        list.innerHTML = `<div class="error">${error.message}</div>`;
    }
}

// ファイル行を作成
function createItem(file) {
    const list = document.getElementById("list");

    const item = document.createElement("div");
    item.className = "item";

    const icon = document.createElement("div");
    icon.className = "icon";
    icon.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/></svg>`;

    const name = document.createElement("div");
    name.className = "name";

    const link = document.createElement("a");
    link.textContent = file.name;

    // クリックで強制ダウンロード
    link.onclick = async function (e) {
        e.preventDefault();

        const url = RAW_BASE + "/" + file.path;

        try {
            const res = await fetch(url);
            if (!res.ok) {
                alert(`ダウンロード失敗 (status: ${res.status})`);
                return;
            }

            const blob = await res.blob();
            const objectUrl = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = objectUrl;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            a.remove();

            URL.revokeObjectURL(objectUrl);
        } catch {
            alert("ダウンロード中にエラーが発生しました");
        }
    };

    name.appendChild(link);

    const size = document.createElement("div");
    size.className = "size";
    size.textContent = formatSize(file.size);

    item.appendChild(icon);
    item.appendChild(name);
    item.appendChild(size);

    list.appendChild(item);
}

// サイズ表示
function formatSize(size) {
    if (size < 1024) return size + " B";
    if (size < 1024 * 1024) return (size / 1024).toFixed(1) + " KB";
    return (size / 1024 / 1024).toFixed(1) + " MB";
}

loadFiles();
</script>

</div>
</body>
</html>
