<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ダウンロード</title>
<style>
body{font-family:system-ui,sans-serif;background:#f6f8fa;margin:0}
main{max-width:900px;margin:24px auto;background:#fff;border:1px solid #d0d7de;border-radius:8px}
h1{margin:0;padding:16px;border-bottom:1px solid #d0d7de}
table{width:100%;border-collapse:collapse}th,td{padding:10px 14px;border-bottom:1px solid #d8dee4}
tr:hover{background:#f6f8fa}a{text-decoration:none;color:#0969da}
.icon{width:18px;height:18px;vertical-align:middle;margin-right:8px}
.small{color:#656d76}
#error{padding:16px;color:#cf222e}
</style></head><body><main><h1>ダウンロード</h1>
<div id="error" hidden></div>
<table><thead><tr><th>名前</th><th>サイズ</th></tr></thead><tbody id="list"></tbody></table>
</main><script>
const USER="yukidama-yoshi";
const REPO="yukidama-yoshi.github.io";
const ROOT="files";
const path=location.pathname.replace(/^\//,"");
let folder=ROOT;
if(path.startsWith(ROOT+"/")) folder=path;
const api=`https://api.github.com/repos/${USER}/${REPO}/contents/${folder}`;
const folderSvg='<svg class="icon" viewBox="0 0 24 24"><path fill="#d29922" d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/></svg>';
const fileSvg='<svg class="icon" viewBox="0 0 24 24"><path fill="#57606a" d="M6 2h8l4 4v16H6z"/><path fill="#fff" d="M14 2v4h4"/></svg>';
fetch(api).then(r=>r.json()).then(items=>{
items=items.filter(i=>i.name.toLowerCase()!=="index.html");
items.sort((a,b)=>a.type===b.type?a.name.localeCompare(b.name):a.type==="dir"?-1:1);
const tb=document.getElementById("list");
for(const i of items){
const tr=document.createElement("tr");
let size=i.type==="dir"?"-":(i.size>1048576?(i.size/1048576).toFixed(2)+" MB":i.size>1024?(i.size/1024).toFixed(1)+" KB":i.size+" B");
let link=i.type==="dir"?`${i.path}/`:i.download_url;
let icon=i.type==="dir"?folderSvg:fileSvg;
tr.innerHTML=`<td>${icon}<a href="${link}">${i.name}${i.type==="dir"?"/":""}</a></td><td class="small">${size}</td>`;
tb.appendChild(tr);
}
}).catch(e=>{let d=document.getElementById("error");d.hidden=false;d.textContent="一覧を取得できませんでした。設定を確認してください。";});
</script></body></html>
