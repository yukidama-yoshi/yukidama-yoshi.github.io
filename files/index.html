<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ファイル一覧</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;
    padding: 20px;

    font-family:
        "MS Gothic",
        "Noto Sans JP",
        sans-serif;

    background: #f4f4f4;
    color: #222;

}



.container {

    max-width: 1000px;

    margin: auto;

    background: white;

    border: 1px solid #ccc;

    padding: 20px;

}



h1 {

    margin-top: 0;

    font-size: 24px;

}



/* パンくず */

#breadcrumb {

    background: #eee;

    padding: 10px;

    margin-bottom: 15px;

    font-size: 14px;

}



.breadcrumb-item {

    color: #0066cc;

    cursor: pointer;

}


.breadcrumb-item:hover {

    text-decoration: underline;

}



/* 一覧ヘッダー */

.header,
.item {

    display: grid;

    grid-template-columns:
        40px
        minmax(0, 1fr)
        120px;

    align-items: center;

}



.header {

    padding: 8px 10px;

    background: #ddd;

    border-bottom: 1px solid #aaa;

    font-weight: bold;

    user-select: none;

}



/* ファイル一覧 */

.item {

    padding: 10px;

    border-bottom: 1px solid #ddd;

}



.item:hover {

    background: #f0f8ff;

}



.icon {

    width: 35px;

    font-size: 20px;

}



.name {

    min-width: 0;

}



.name a {

    color: #0066cc;

    text-decoration: none;

    cursor: pointer;

    word-break: break-all;

}



.name a:hover {

    text-decoration: underline;

}



.size {

    text-align: right;

    color: #666;

    font-size: 13px;

}



.loading {

    text-align: center;

    padding: 30px;

}



.error {

    color: red;

    padding: 20px;

}



</style>


</head>


<body>


<div class="container">


<h1>ファイル一覧</h1>


<div id="breadcrumb">

読み込み中...

</div>



<div class="header">

    <div></div>

    <div>名前</div>

    <div>サイズ</div>

</div>



<div id="list" class="list">

    <div class="loading">

        読み込み中...

    </div>

</div>

<script>


// GitHub設定

const OWNER = "yukidama-yoshi";
const REPO = "yukidama-yoshi.github.io";
const BRANCH = "files";



const API_BASE =
    `https://api.github.com/repos/${OWNER}/${REPO}/contents`;

const RAW_BASE =
    `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;



// 現在のパス

const params =
    new URLSearchParams(location.search);


let currentPath =
    params.get("path") || "";





// ファイル取得

async function loadFiles(){


    const list =
        document.getElementById("list");



    try {


        const url =
            currentPath
            ? `${API_BASE}/${currentPath}`
            : API_BASE;



        const response =
            await fetch(url);



        if(!response.ok){

            throw new Error(
                "GitHub API取得失敗"
            );

        }



        const files =
            await response.json();



        showBreadcrumb();



        list.innerHTML = "";



        // フォルダを先に表示

        files
        .filter(file => file.type === "dir")
        .forEach(file => {

            createItem(file, true);

        });



        // ファイル表示

        files
        .filter(file => file.type === "file")
        .forEach(file => {

            createItem(file, false);

        });



        if(files.length === 0){

            list.innerHTML =
            "<div class='loading'>ファイルがありません</div>";

        }



    } catch(error){


        list.innerHTML =

        `<div class="error">
        ファイル一覧を取得できませんでした<br>
        ${error.message}
        </div>`;


    }


}







// 一覧1行作成

function createItem(file, isDir){


    const list =
        document.getElementById("list");



    const item =
        document.createElement("div");


    item.className =
        "item";




    const icon =
        document.createElement("div");


    icon.className =
        "icon";


    icon.textContent =
        isDir ? "📁" : "📄";





    const name =
        document.createElement("div");


    name.className =
        "name";





    const link =
        document.createElement("a");


    link.textContent =
        file.name;





    if(isDir){


        link.onclick = function(){


            location.href =

            "?path=" +

            encodeURIComponent(file.path);


        };



    } else {



        link.href =

        RAW_BASE +

        "/" +

        file.path;



        // 直接ダウンロード

        link.download =
            file.name;


    }





    name.appendChild(link);






    const size =
        document.createElement("div");


    size.className =
        "size";



    size.textContent =

        isDir

        ? "-"

        : formatSize(file.size);







    item.appendChild(icon);

    item.appendChild(name);

    item.appendChild(size);




    list.appendChild(item);



}






// サイズ変換

function formatSize(size){


    if(size < 1024){

        return size + " B";

    }



    if(size < 1024 * 1024){

        return

        (size / 1024).toFixed(1)

        + " KB";

    }



    return

    (size / 1024 / 1024).toFixed(1)

    + " MB";


}

// パンくず表示

function showBreadcrumb(){


    const breadcrumb =
        document.getElementById("breadcrumb");



    breadcrumb.innerHTML = "";



    const home =
        document.createElement("span");


    home.className =
        "breadcrumb-item";


    home.textContent =
        "ホーム";



    home.onclick = function(){


        location.href =
            location.pathname;


    };



    breadcrumb.appendChild(home);





    if(currentPath){



        const parts =
            currentPath.split("/");



        let path = "";



        parts.forEach((part, index)=>{


            path +=

            (index === 0 ? "" : "/")

            + part;





            const separator =
                document.createElement("span");


            separator.textContent =
                " ＞ ";


            breadcrumb.appendChild(separator);






            const item =
                document.createElement("span");



            item.className =
                "breadcrumb-item";



            item.textContent =
                part;





            const target =
                path;





            item.onclick = function(){



                location.href =

                "?path=" +

                encodeURIComponent(target);



            };





            breadcrumb.appendChild(item);



        });


    }


}







// 起動

loadFiles();



</script>


</body>

</html>
