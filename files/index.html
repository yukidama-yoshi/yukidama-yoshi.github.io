<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ファイル一覧</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family:
        "MS Gothic",
        "Noto Sans JP",
        sans-serif;
    background: #f4f4f4;
    color: #222;
}

.container {
    max-width: 1000px;
    margin: auto;
    background: white;
    border: 1px solid #ccc;
    padding: 20px;
}

h1 {
    margin-top: 0;
    font-size: 24px;
}

#breadcrumb {
    background: #eee;
    padding: 10px;
    margin-bottom: 15px;
    font-size: 14px;
}

.breadcrumb-item {
    color: #0066cc;
    cursor: pointer;
}

.breadcrumb-item:hover {
    text-decoration: underline;
}

.list {
    border-top: 1px solid #ccc;
}

.item {
    display: flex;
    align-items: center;
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

.item:hover {
    background: #f0f8ff;
}

.icon {
    width: 35px;
    font-size: 20px;
}

.name {
    flex: 1;
}

.name a {
    color: #0066cc;
    text-decoration: none;
    cursor: pointer;
}

.name a:hover {
    text-decoration: underline;
}

.size {
    width: 120px;
    text-align: right;
    color: #666;
    font-size: 13px;
}

.date {
    width: 170px;
    text-align: right;
    color: #777;
    font-size: 13px;
}

.loading {
    text-align: center;
    padding: 30px;
}

.error {
    color: red;
    padding: 20px;
}
</style>

</head>

<body>

<div class="container">

<h1>ファイル一覧</h1>

<div id="breadcrumb">
読み込み中...
</div>

<div id="list" class="list">
<div class="loading">
読み込み中...
</div>
</div>

</div>
<script>

const OWNER = "yukidama-yoshi";
const REPO = "yukidama-yoshi.github.io";
const BRANCH = "files";

const API_BASE =
    `https://api.github.com/repos/${OWNER}/${REPO}/contents`;

const RAW_BASE =
    `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;


const params = new URLSearchParams(location.search);
let currentPath = params.get("path") || "";


async function loadFiles(){

    const list = document.getElementById("list");

    try {

        const url =
            currentPath
            ? `${API_BASE}/${currentPath}`
            : API_BASE;

        const res = await fetch(url);

        if(!res.ok){
            throw new Error("取得失敗");
        }

        const files = await res.json();

        showBreadcrumb();

        list.innerHTML = "";

        // フォルダを先に表示
        const dirs =
            files.filter(f => f.type === "dir");

        const normalFiles =
            files.filter(f => f.type === "file");


        dirs.forEach(file => {
            createItem(file, true);
        });


        normalFiles.forEach(file => {
            createItem(file, false);
        });


        if(files.length === 0){
            list.innerHTML =
            "<div class='loading'>ファイルがありません</div>";
        }


    } catch(e){

        list.innerHTML =
        `<div class="error">
        ファイル一覧を取得できませんでした<br>
        ${e}
        </div>`;

    }

}



function createItem(file, isDir){

    const list =
        document.getElementById("list");


    const item =
        document.createElement("div");

    item.className = "item";


    const icon =
        document.createElement("div");

    icon.className = "icon";

    icon.textContent =
        isDir ? "📁" : "📄";


    const name =
        document.createElement("div");

    name.className = "name";


    const link =
        document.createElement("a");


    link.textContent =
        file.name;


    if(isDir){

        link.onclick = () => {

            location.href =
            "?path=" +
            encodeURIComponent(file.path);

        };

    }else{

        link.href =
        RAW_BASE + "/" + file.path;

        link.download =
        file.name;

    }


    name.appendChild(link);


    const size =
        document.createElement("div");

    size.className = "size";

    size.textContent =
        isDir
        ? "-"
        : formatSize(file.size);


    const date =
        document.createElement("div");

    date.className = "date";

    date.textContent =
        "";


    item.appendChild(icon);
    item.appendChild(name);
    item.appendChild(size);
    item.appendChild(date);


    list.appendChild(item);

}



function formatSize(size){

    if(size < 1024){
        return size + " B";
    }

    if(size < 1024 * 1024){
        return
        (size / 1024).toFixed(1)
        + " KB";
    }

    return
    (size / 1024 / 1024).toFixed(1)
    + " MB";

}
function showBreadcrumb(){

    const breadcrumb =
        document.getElementById("breadcrumb");

    breadcrumb.innerHTML = "";


    const root =
        document.createElement("span");

    root.className =
        "breadcrumb-item";

    root.textContent =
        "ホーム";


    root.onclick = () => {

        location.href =
        location.pathname;

    };


    breadcrumb.appendChild(root);



    if(currentPath){

        const parts =
            currentPath.split("/");


        let path = "";


        parts.forEach((part, index)=>{

            path +=
            (index === 0 ? "" : "/")
            + part;


            const separator =
                document.createElement("span");

            separator.textContent =
                " ＞ ";

            breadcrumb.appendChild(separator);



            const item =
                document.createElement("span");

            item.className =
                "breadcrumb-item";

            item.textContent =
                part;



            const targetPath =
                path;


            item.onclick = () => {

                location.href =
                "?path=" +
                encodeURIComponent(targetPath);

            };


            breadcrumb.appendChild(item);

        });

    }

}



loadFiles();

</script>

</body>
</html>
