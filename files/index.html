<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ファイル一覧</title>

<style>
/* 省略（前回と同じ） */
</style>
</head>

<body>
<div class="container">

<h1>ファイル一覧</h1>

<div class="header">
    <div></div>
    <div>名前</div>
    <div>サイズ</div>
</div>

<div id="list">
    <div class="loading">読み込み中...</div>
</div>

<script>
const RAW_BASE = "https://raw.githubusercontent.com/yukidama-yoshi/yukidama-yoshi.github.io/main";

async function loadFiles() {
    const list = document.getElementById("list");

    try {
        const response = await fetch("files.json");
        if (!response.ok) throw new Error("files.json が読み込めません");

        const files = await response.json();
        list.innerHTML = "";

        files.forEach(file => createItem(file));

        if (files.length === 0) {
            list.innerHTML = "<div class='loading'>ファイルがありません</div>";
        }

    } catch (error) {
        list.innerHTML = `<div class="error">${error.message}</div>`;
    }
}

function createItem(file) {
    const list = document.getElementById("list");

    const item = document.createElement("div");
    item.className = "item";

    const icon = document.createElement("div");
    icon.className = "icon";
    icon.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/></svg>`;

    const name = document.createElement("div");
    name.className = "name";

    const link = document.createElement("a");
    link.textContent = file.name;

    link.onclick = async function (e) {
        e.preventDefault();

        const url = RAW_BASE + "/" + file.path;

        try {
            const res = await fetch(url);
            if (!res.ok) {
                alert(`ダウンロード失敗 (status: ${res.status})`);
                return;
            }

            const blob = await res.blob();
            const objectUrl = URL.createObjectURL(blob);

            const a = document.createElement("a");
            a.href = objectUrl;
            a.download = file.name;
            document.body.appendChild(a);
            a.click();
            a.remove();

            URL.revokeObjectURL(objectUrl);
        } catch {
            alert("ダウンロード中にエラーが発生しました");
        }
    };

    name.appendChild(link);

    const size = document.createElement("div");
    size.className = "size";
    size.textContent = formatSize(file.size);

    item.appendChild(icon);
    item.appendChild(name);
    item.appendChild(size);

    list.appendChild(item);
}

function formatSize(size) {
    if (size < 1024) return size + " B";
    if (size < 1024 * 1024) return (size / 1024).toFixed(1) + " KB";
    return (size / 1024 / 1024).toFixed(1) + " MB";
}

loadFiles();
</script>

</div>
</body>
</html>
