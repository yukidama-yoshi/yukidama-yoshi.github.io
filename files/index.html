<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Files</title><style>
body{font-family:system-ui,sans-serif;background:#f6f8fa;margin:0}
main{max-width:960px;margin:20px auto;background:#fff;border:1px solid #d0d7de;border-radius:8px}
h1,#crumb{padding:14px 18px;margin:0}#crumb{border-top:1px solid #d8dee4;border-bottom:1px solid #d8dee4;background:#f6f8fa}
table{width:100%;border-collapse:collapse}th,td{padding:10px 16px;border-bottom:1px solid #eee}a{text-decoration:none;color:#0969da}
tr:hover{background:#f6f8fa}.muted{color:#666}.i{width:16px;height:16px;vertical-align:-3px;margin-right:8px}
</style></head><body><main><h1>ダウンロード</h1><div id="crumb"></div><table><thead><tr><th>名前</th><th>サイズ</th></tr></thead><tbody id="tb"></tbody></table></main>
<script>
const USER="yukidama-yoshi",REPO="yukidama-yoshi.github.io",ROOT="files";
const qs=new URLSearchParams(location.search); const rel=qs.get("path")||"";
const api=`https://api.github.com/repos/${USER}/${REPO}/contents/${ROOT}${rel?"/"+rel:""}`;
const folder='<svg class=i viewBox="0 0 24 24"><path fill="#d29922" d="M2 6a2 2 0 0 1 2-2h5l2 2h9a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2z"/></svg>';
const file='<svg class=i viewBox="0 0 24 24"><path fill="#57606a" d="M6 2h8l4 4v16H6z"/><path fill="#fff" d="M14 2v4h4"/></svg>';
function nav(){
 let c='<a href="?">files</a>'; 
 if(rel){let acc=""; for(const p of rel.split("/")){acc+=(acc?"/":"")+p;c+=" / <a href='?path="+encodeURIComponent(acc)+"'>"+p+"</a>";}}
 if(rel){let up=rel.includes("/")?rel.substring(0,rel.lastIndexOf("/")):""; c+=' &nbsp;|&nbsp; <a href="?'+(up?'path='+encodeURIComponent(up):'')+'">親フォルダへ</a>';}
 crumb.innerHTML=c;
}
nav();
fetch(api).then(r=>{if(!r.ok)throw 0;return r.json()}).then(items=>{
items=items.filter(x=>x.name.toLowerCase()!="index.html");
items.sort((a,b)=>a.type==b.type?a.name.localeCompare(b.name):a.type=="dir"?-1:1);
for(const i of items){
let tr=document.createElement("tr");
let href=i.type=="dir"?"?path="+encodeURIComponent(rel?rel+"/"+i.name:i.name):i.download_url;
let size=i.type=="dir"?"-":i.size>1048576?(i.size/1048576).toFixed(2)+" MB":i.size>1024?(i.size/1024).toFixed(1)+" KB":i.size+" B";
tr.innerHTML=`<td>${i.type=="dir"?folder:file}<a href="${href}">${i.name}${i.type=="dir"?"/":""}</a></td><td class=muted>${size}</td>`;
tb.appendChild(tr);
}
}).catch(()=>tb.innerHTML='<tr><td colspan=2>取得に失敗しました。設定を確認してください。</td></tr>');
</script></body></html>
